<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Colors are the site's dark-theme tokens (styles.css): n1 #0e1116, n3 #272d38,
       n4 #9aa3b2, n5 #e9ecf1, a5 #8ab2ff. build-og.mjs fills in the two data URIs. -->
  <defs>
    <clipPath id="shot"><rect x="640" y="104" width="640" height="600" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0e1116"/>

  <image x="72" y="68" width="64" height="64" href="{{ICON_DATA_URI}}"/>
  <text x="148" y="112" font-size="34" font-weight="600" fill="#e9ecf1" letter-spacing="-0.5">Houston</text>

  <g font-size="60" font-weight="700" fill="#e9ecf1" letter-spacing="-1.8">
    <text x="72" y="256">A coding agent</text>
    <text x="72" y="326">that runs on</text>
    <text x="72" y="396">your machine.</text>
  </g>

  <g font-size="26" fill="#9aa3b2">
    <text x="72" y="458">Bring your own model: Claude, GPT,</text>
    <text x="72" y="494">Gemini, or a local LLM.</text>
  </g>

  <g font-size="22" font-weight="500" fill="#e9ecf1">
    <path d="M74 562l6 6 12-13" fill="none" stroke="#8ab2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="569">Runs locally</text>
    <path d="M254 562l6 6 12-13" fill="none" stroke="#8ab2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="569">No telemetry</text>
    <path d="M442 562l6 6 12-13" fill="none" stroke="#8ab2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="470" y="569">Sandboxed</text>
  </g>

  <g clip-path="url(#shot)">
    <image x="640" y="104" width="928" height="600" preserveAspectRatio="xMinYMin slice" href="{{SHOT_DATA_URI}}"/>
  </g>
  <rect x="640.5" y="104.5" width="640" height="600" rx="16" fill="none" stroke="#272d38"/>
</svg>
