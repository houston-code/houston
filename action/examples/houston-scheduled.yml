# Run Houston on a schedule, or by hand from the Actions tab. By default the run is
# read-only: it investigates the task in `prompt` and writes its report to the job
# summary. To let it change code instead, set `mode: implement` (and grant
# `contents: write` and `pull-requests: write`): it then commits to a new branch under
# houston/ and opens a pull request against the branch the run started on.
name: Houston (scheduled)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      prompt:
        description: What Houston should look into.
        required: false
        default: ''

permissions: {}

concurrency:
  group: houston-scheduled
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the full commit SHA of the release tag in your workflow (see action/README.md).
      # Only someone with write access can start workflow_dispatch, so its input may be the
      # task. Never pass issue or comment text here: the prompt is trusted.
      - uses: houston-code/houston/action@v0.10.0 # zizmor: ignore[unpinned-uses] example only
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          max-cost: '2'
          prompt: ${{ inputs.prompt || 'List the TODO comments in this repository that look out of date, with file and line.' }}
