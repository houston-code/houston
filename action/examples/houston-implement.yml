# Let Houston implement an issue when a collaborator with write access adds the `houston`
# label or comments `@houston implement`. Houston makes the change on a new branch under
# houston/ and opens a pull request that links the issue. It never pushes to the default
# branch or to an existing pull request's branch.
#
# Only someone with write access starts a run: the action checks the commenter's (or the
# labeller's) actual repository permission. The issue itself is read through Houston's gh
# tools, which hand it to the model as untrusted data.
name: Houston (implement)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: houston-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # A cheap first filter, so unrelated labels and comments don't start a runner. The
    # action applies the real checks (the command outside code and quotes, write access).
    if: >-
      !github.event.issue.pull_request
      && (github.event.label.name == 'houston'
        || (contains(github.event.comment.body, '@houston implement')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The default branch, never a pull request's head: this event runs with the
      # repository's secrets, so fork code must not run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install what your test suite needs here, before Houston runs: its shell commands
      # are sandboxed without network access.
      # Pin the full commit SHA of the release tag in your workflow (see action/README.md).
      - uses: houston-code/houston/action@v0.10.0 # zizmor: ignore[unpinned-uses] example only
        with:
          mode: implement
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          verify: npm test
          max-cost: '3'
