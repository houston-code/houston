name: Nightly build

# Validates the FULL macOS/Windows/Linux packaging matrix (plus the macOS packaged-app
# e2e) once a day. Per-PR CI only packages Linux to save macOS (×10) / Windows (×2) Actions
# minutes, so without this a macOS or Windows packaging regression would first surface when
# cutting a release — and block it. This catches it within a day instead.
#
# THIS WORKFLOW NEVER PUBLISHES A RELEASE. Three independent guarantees:
#   1. electron-builder is invoked with `--publish never`.
#   2. No publish credential is in scope (GH_RELEASES_TOKEN is never set here), so even an
#      accidental `--publish always` would have nothing to authenticate with.
#   3. `permissions: contents: read` — the job literally cannot create a tag or release.
# Build outputs are uploaded only as ephemeral Actions artifacts (invisible to the updater,
# which reads published Releases) for inspection when a nightly fails.

on:
  schedule:
    # 07:00 UTC daily. Cron has no timezone; this is a fixed UTC wall-clock time.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Don't stack nightlies (or a manual run on top of a scheduled one) — keep the latest.
concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Nightly validates PACKAGING, not distribution: never sign or notarize here. No signing
  # secrets are in scope, and this forces electron-builder to skip macOS signing outright
  # rather than probing the keychain — so a runner that happens to carry a signing identity
  # can't change the output. Real signing happens only in release-publish.yml.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    # Cross-compilation is impossible (native node-pty + per-(os,arch) rg/ast-grep binaries),
    # so each OS packages its own artifacts on its own runner — same matrix as the release
    # workflows, minus the publish.
    timeout-minutes: 40
    # windows-latest defaults `run:` steps to PowerShell; force bash for the whole matrix so a
    # bash step (e.g. a future multi-line if/else) can't silently fail only on the Windows leg.
    # Git Bash ships on the Windows runner, and macOS/Linux already default to bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35 = our documented Linux floor), not
          # ubuntu-latest: node-pty compiles here, so the runner's glibc sets the shipped
          # app's minimum. Matches the other workflows' Linux legs. See ci.yml's `build`.
          - os: ubuntu-22.04
            dist: dist:linux
            artifact: nightly-linux-x64
          - os: macos-14
            dist: dist:mac
            artifact: nightly-mac-arm64
          # macos-15-intel is GitHub's Intel (x64) runner — the only place the x64 mac app
          # builds natively (node-pty + per-arch rg/ast-grep don't cross-compile). Validates
          # Intel packaging nightly, same as the release workflows' Intel leg. No publish here.
          # It replaces the retired macos-13 image (shut down 2025-12-04); GitHub sunsets x64
          # macOS runners entirely after macos-15 (~Fall 2027), at which point Intel needs a
          # universal-on-arm64 build or gets dropped. Keep this label in lockstep across the
          # nightly / release-prepare / release-publish Intel legs.
          - os: macos-15-intel
            dist: dist:mac:x64
            artifact: nightly-mac-x64
          - os: windows-latest
            dist: dist:win
            artifact: nightly-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Fail if THIRD-PARTY-NOTICES.md drifted from the current dependency closure. Kept off
      # per-PR CI on purpose (deps change infrequently); nightly + the release workflows are
      # where a stale attribution doc would otherwise ship next to a freshly-generated SBOM.
      - name: Check THIRD-PARTY-NOTICES.md is current
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md \
            || { echo "::error::THIRD-PARTY-NOTICES.md is out of date — run 'npm run notices' and commit it."; exit 1; }
      # Platform-specific unit coverage that moved off per-PR CI (bills macOS ×10 / Windows
      # ×2). macOS runs the full suite (exercises the real Seatbelt sandbox backend); Windows
      # runs the execution-backend suite (scoped to src/main/sandbox — the broader suite has
      # macOS-shaped tests that don't run on Windows). Linux/Intel-mac legs skip it: Linux
      # unit coverage is on per-PR CI, and the arm64 leg already covers the macOS suite.
      - if: matrix.os == 'macos-14'
        run: npm test
      - if: matrix.os == 'windows-latest'
        run: npx vitest run src/main/sandbox
      # `--publish never` appends to the dist script's electron-builder invocation, so it
      # packages without ever contacting the release repo. (Belt-and-suspenders: there is no
      # token in scope and no write permission either.)
      - run: npm run ${{ matrix.dist }} -- --publish never
      # Packaged-app e2e (built .app via Playwright) — the assertion that the asar archive +
      # afterPack vendored binaries (Resources/bin/{rg,ast-grep}) + main↔preload↔renderer
      # bridge all work. Off the per-PR path to save macOS minutes; this is its nightly home.
      - if: matrix.os == 'macos-14'
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          # Inspection-only artifact, never a published feed. Short retention caps storage.
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
