name: SBOM

# On-demand Software Bill of Materials (CycloneDX + SPDX) for the production
# dependency closure. Generated with npm's built-in `npm sbom` (npm 10+, no extra
# tooling to vendor).
#
# This is the AD-HOC generator (manual dispatch only). The per-release SBOM — the one
# that ships attached to each published GitHub Release — is produced by the Linux leg
# of release-publish.yml, NOT here. A `push: branches: [main]` trigger was tried and
# removed: it fired only sporadically and never produced a durable release asset. A
# GITHUB_TOKEN auto-merge (routine feature PRs) does not start a workflow run at all, so
# most commits to main got no SBOM; a release PR merged by hand DID fire it, but only as
# a transient 90-day Actions artifact. See ci.yml's push-trigger note for the same
# GITHUB_TOKEN limitation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # `npm sbom` only reads the dependency tree; skip postinstall's native rebuild
      # (electron-rebuild) since node-pty doesn't need compiling to enumerate deps.
      - run: npm ci --ignore-scripts
      - name: Generate SBOMs (production dependency closure)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
          npm sbom --sbom-format spdx --omit dev > sbom.spdx.json
      # Fail loudly if a format emitted an empty or malformed document rather than
      # uploading a hollow SBOM that reads as "we have one" — the same fail-closed
      # stance as scripts/verify-bundled-binaries.mjs.
      - name: Verify SBOMs are valid and non-empty
        run: |
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            node -e "const j=JSON.parse(require('node:fs').readFileSync('$f','utf8')); const n=(j.components||j.packages||[]).length; if(!n){console.error('::error::'+process.argv[1]+' has no components'); process.exit(1)} console.log(process.argv[1]+' OK ('+n+' entries)')" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: houston-sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          if-no-files-found: error
