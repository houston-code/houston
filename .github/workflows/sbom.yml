name: SBOM

# On-demand Software Bill of Materials (CycloneDX + SPDX) for the production
# dependency closure. Generated with Syft, scanning package-lock.json directly.
# npm's built-in `npm sbom --omit dev` was tried first but silently under-reports:
# it emitted 56 of the 73 production packages, dropping runtime transitives that npm
# dev-flags during hoisting. Syft reads the lockfile's own dev flags, excludes dev by
# default, and emits both formats from one scan so they describe an identical closure.
#
# SCOPE: this is the JavaScript DEPENDENCY closure only. The native/runtime layer — the
# Electron runtime and the Chromium + Node it embeds, node-pty, and the vendored rg/ast-grep
# CLIs — ships as binaries, not lockfile entries, so Syft can't see it here (a scan of the
# packaged app finds ~none of it). That layer gets its own deep binary SBOM, generated
# per-platform from each build leg's real packaged artifact by scripts/binary-sbom.mjs in
# release-publish.yml (one sbom.binary.<os-arch>.* per leg, so the hashes match that platform).
#
# This is the AD-HOC generator (manual dispatch only). The per-release SBOM — the one
# that ships attached to each published GitHub Release — is produced by the Linux leg
# of release-publish.yml, NOT here. A `push: branches: [main]` trigger was tried and
# removed: it never produced a durable release asset. A push trigger would only change how
# OFTEN this fires, not what it yields: a transient 90-day Actions
# artifact rather than something attached to a Release. Re-adding the trigger would burn
# minutes on every merge for an artifact that expires.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom
  cancel-in-progress: true

jobs:
  # Run the same conformance suite (NTIA / CISA FSCT3 / CycloneDX / Google-EO) the release
  # builds gate on, so a dispatch of this on-demand generator also reports whether the SBOMs
  # are conformant. A sibling (not a gate): the `sbom` job still produces the signed artifact
  # for inspection even if conformance fails, and a failure turns the run red.
  sbom-conformance:
    uses: ./.github/workflows/sbom-conformance.yml

  sbom:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # cosign keyless signing (below) mints an OIDC token to get a short-lived Fulcio cert and
      # records the signature in the public Rekor log. Unlike GitHub artifact attestation, this
      # needs no attestation store, so it works on any user-owned repo, and anyone can
      # verify against the public log with no repo access. Dispatching this workflow doubles as
      # the end-to-end test of that signing path before the release pipeline relies on it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # syft enumerates deps from the lockfile, but the enrichment step reads each package's
      # `author` from its installed manifest, so a production-only install is needed for that.
      # --ignore-scripts skips the native rebuild (electron-rebuild) — not needed to read
      # package.json. --omit=dev keeps node_modules aligned with the production closure.
      - uses: ./.github/actions/setup-node
        with:
          install: production
      # Generate, enrich and verify the three SBOMs. Shared with sbom-conformance.yml and
      # release-publish.yml so all three describe the same closure.
      - uses: ./.github/actions/sbom-generate
      # Vulnerability gate: scan the production SBOM with grype and fail on a High/Critical
      # with a fix available. only-fixed avoids dead-ending on an unpatchable finding; a
      # finding you have assessed as not-exploitable is suppressed via the VEX document
      # (.github/vex/houston.openvex.json — see .github/vex/README.md). Scans the closure that
      # ships.
      - name: Scan SBOM for vulnerabilities (fail on fixable High/Critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cyclonedx.json
          # Pin a Grype new enough to read the CycloneDX the pinned Syft emits.
          grype-version: v0.115.0
          vex: .github/vex/houston.openvex.json
          severity-cutoff: high
          only-fixed: true
          output-format: table
      # Keyless-sign each SBOM with cosign. Produces a self-contained sigstore bundle (sig +
      # Fulcio cert + Rekor inclusion proof) per file. Verify with, e.g.:
      #   cosign verify-blob sbom.cyclonedx.json \
      #     --bundle sbom.cyclonedx.json.cosign.bundle \
      #     --certificate-identity 'https://github.com/houston-code/houston/.github/workflows/sbom.yml@refs/heads/main' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'
      - name: Sign the SBOMs (cosign keyless)
        run: |
          for f in sbom.cyclonedx.json sbom.spdx.json sbom.spdx3.json; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: houston-sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            sbom.spdx3.json
            sbom.cyclonedx.json.cosign.bundle
            sbom.spdx.json.cosign.bundle
            sbom.spdx3.json.cosign.bundle
          if-no-files-found: error
