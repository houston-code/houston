name: SBOM

# On-demand Software Bill of Materials (CycloneDX + SPDX) for the production
# dependency closure. Generated with Syft, scanning package-lock.json directly.
# npm's built-in `npm sbom --omit dev` was tried first but silently under-reports:
# it emitted 56 of the 73 production packages, dropping runtime transitives that npm
# dev-flags during hoisting. Syft reads the lockfile's own dev flags, excludes dev by
# default, and emits both formats from one scan so they describe an identical closure.
#
# This is the AD-HOC generator (manual dispatch only). The per-release SBOM — the one
# that ships attached to each published GitHub Release — is produced by the Linux leg
# of release-publish.yml, NOT here. A `push: branches: [main]` trigger was tried and
# removed: it fired only sporadically and never produced a durable release asset. A
# GITHUB_TOKEN auto-merge (routine feature PRs) does not start a workflow run at all, so
# most commits to main got no SBOM; a release PR merged by hand DID fire it, but only as
# a transient 90-day Actions artifact. See ci.yml's push-trigger note for the same
# GITHUB_TOKEN limitation.
on:
  workflow_dispatch:

permissions:
  contents: read
  # cosign keyless signing (below) mints an OIDC token to get a short-lived Fulcio cert and
  # records the signature in the public Rekor log. Unlike GitHub artifact attestation, this
  # needs no attestation store, so it works on this user-owned PRIVATE repo — and anyone can
  # verify against the public log with no repo access. Dispatching this workflow doubles as
  # the end-to-end test of that signing path before the release pipeline relies on it.
  id-token: write

jobs:
  sbom:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # syft enumerates deps from the lockfile, but the enrichment step reads each package's
      # `author` from its installed manifest, so a production-only install is needed for that.
      # --ignore-scripts skips the native rebuild (electron-rebuild) — not needed to read
      # package.json. --omit=dev keeps node_modules aligned with the production closure.
      - run: npm ci --omit=dev --ignore-scripts
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOMs (production dependency closure)
        run: |
          # Scan the lockfile, not node_modules: syft honors its dev flags and needs no
          # install to enumerate. One scan emits both formats, so CycloneDX and SPDX match.
          syft scan file:./package-lock.json \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o spdx-json=sbom.spdx.json
          # The lockfile carries no per-component hashes or author, so enrich both documents
          # in place from its own integrity (sha512) and each package's installed manifest.
          # This only ADDS fields — the complete closure syft produced is preserved exactly.
          node scripts/enrich-sbom.mjs sbom.cyclonedx.json sbom.spdx.json
      # Fail loudly if a format emitted a truncated document, or one enrichment left without
      # hashes, rather than uploading a hollow SBOM — the same fail-closed stance as
      # scripts/verify-bundled-binaries.mjs. The entry floor guards against a silent
      # regression to a partial closure like npm sbom's 56 (full production set is ~73); the
      # hash floor catches enrichment silently no-op'ing.
      - name: Verify SBOMs are valid and complete
        run: |
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            node -e "const j=JSON.parse(require('node:fs').readFileSync('$f','utf8')); const items=j.components||j.packages||[]; const n=items.length; const h=items.filter(x=>(x.hashes||x.checksums||[]).length).length; if(n<60){console.error('::error::'+process.argv[1]+' has only '+n+' entries (<60) — closure looks truncated'); process.exit(1)} if(h<60){console.error('::error::'+process.argv[1]+' has only '+h+' hashed entries (<60) — enrichment did not run'); process.exit(1)} console.log(process.argv[1]+' OK ('+n+' entries, '+h+' hashed)')" "$f"
          done
      # Vulnerability gate: scan the production SBOM with grype and fail on a High/Critical
      # with a fix available. only-fixed avoids dead-ending on an unpatchable finding; a
      # finding you have assessed as not-exploitable is suppressed via the VEX document
      # (.github/vex/houston.openvex.json — see .github/vex/README.md). Scans the closure that
      # ships.
      - name: Scan SBOM for vulnerabilities (fail on fixable High/Critical)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.cyclonedx.json
          vex: .github/vex/houston.openvex.json
          severity-cutoff: high
          only-fixed: true
          output-format: table
      # Keyless-sign each SBOM with cosign. Produces a self-contained sigstore bundle (sig +
      # Fulcio cert + Rekor inclusion proof) per file. Verify with, e.g.:
      #   cosign verify-blob sbom.cyclonedx.json \
      #     --bundle sbom.cyclonedx.json.cosign.bundle \
      #     --certificate-identity 'https://github.com/piyushvijay/houston/.github/workflows/sbom.yml@refs/heads/main' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - name: Sign the SBOMs (cosign keyless)
        run: |
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: houston-sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            sbom.cyclonedx.json.cosign.bundle
            sbom.spdx.json.cosign.bundle
          if-no-files-found: error
