name: Release - publish

# Manual trigger — run AFTER the `release/vX.Y.Z` PR from "Release - prepare" has merged to
# main. Builds the full signed matrix (macOS arm64, Windows x64, Linux x64) and publishes a
# GitHub Release to the PUBLIC releases repo, which is what electron-updater reads. The
# release is created as a draft by electron-builder, then the finalize job attaches the
# CHANGELOG notes, un-drafts it, and marks it `latest` so the updater picks it up.
#
# Distribution lives in a SEPARATE PUBLIC repo (piyushvijay/houston-releases) so the app
# can fetch updates with no embedded token, while source stays private. Writing to that
# repo requires a PAT (the default GITHUB_TOKEN is scoped to this repo only): mint a
# fine-grained PAT with contents:write on houston-releases and add it as the
# GH_RELEASES_TOKEN secret here.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts but do NOT publish to the public repo'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  guard:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_RELEASES_TOKEN for a real publish
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_RELEASES_TOKEN secret is not set. Mint a fine-grained PAT with contents:write on piyushvijay/houston-releases and add it as the GH_RELEASES_TOKEN repo secret. (Or re-run with dry_run=true to only build artifacts.)"
            exit 1
          fi

  build:
    needs: guard
    timeout-minutes: 40
    permissions:
      contents: read
      # For the attestation steps below: id-token mints the OIDC token that proves the build
      # identity, and attestations:write records the signed provenance/SBOM attestations on
      # THIS (source) repo's attestation store, verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # Serialize so the three platforms don't race to CREATE the same draft release on the
      # public repo (the first leg creates it; the others upload into it). Releases are
      # infrequent, so the extra wall-clock is fine in exchange for a deterministic publish.
      max-parallel: 1
      matrix:
        include:
          # macos-14 (arm64) MUST be first: its `--publish always` creates the draft release
          # AND owns the single `latest-mac.yml` update feed. The macos-15-intel (Intel) leg
          # then uploads only its .dmg/.zip INTO that existing draft — never its own
          # latest-mac.yml, which would clobber arm64's and break the updater
          # (electron-builder#5592). max-parallel:1 (above) keeps this order deterministic.
          # macos-15-intel replaces the retired macos-13 image (shut down 2025-12-04); GitHub
          # sunsets x64 macOS after macos-15 (~Fall 2027). Keep the Intel label in lockstep
          # with nightly-build / release-prepare.
          - os: macos-14
            dist: dist:mac
          - os: macos-15-intel
            dist: dist:mac:x64
            mac_x64_manual: true
          - os: windows-latest
            dist: dist:win
          # Pinned to ubuntu-22.04 (glibc 2.35 = our documented Linux floor), not
          # ubuntu-latest: node-pty compiles here, so the runner's glibc sets the SHIPPED
          # app's minimum glibc. This is the binding one for users. See ci.yml's `build`.
          - os: ubuntu-22.04
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Package and publish
        # electron-builder's github publisher reads GH_TOKEN; pointing it at the PAT makes
        # it write to the public houston-releases repo (per electron-builder.yml `publish`).
        # GITHUB_TOKEN is intentionally NOT in scope here — it can't write that repo.
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
          # macOS code-signing + notarization. SCOPED to the macOS legs via startsWith():
          # CSC_LINK/CSC_KEY_PASSWORD are ALSO electron-builder's Windows Authenticode vars,
          # so leaking the mac .p12 to the Windows leg would make it try to sign the installer
          # with an Apple cert and fail. An empty value on non-mac legs = signing skipped there
          # (Windows/Linux stay unsigned until they get their own certs). electron-builder v26
          # auto-notarizes when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set.
          CSC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_TEAM_ID || '' }}
        # This step is a bash script (if/elif/else/fi). On windows-latest the default `run:`
        # shell is PowerShell, which can't parse it ("Missing '(' after 'if'"); force bash so
        # the one script runs identically on every matrix leg. Git Bash ships on the Windows
        # runner, and macOS/Linux already default to bash, so their behavior is unchanged.
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Dry run: build only, never publish. The explicit `--publish never` also silences
            # electron-builder's deprecated implicit-publish-on-CI detection (removed in v27).
            npm run ${{ matrix.dist }} -- --publish never
          elif [ "${{ matrix.mac_x64_manual }}" = "true" ]; then
            # Intel mac: build WITHOUT electron-builder's publisher (its latest-mac.yml lists
            # only x64 — publishing it as-is would clobber the arm64 feed: electron-builder#5592).
            # Instead, MERGE this build's x64 files INTO the arm64 feed the macos-14 leg already
            # published, so one latest-mac.yml auto-updates BOTH arches — MacUpdater self-selects
            # per arch from the `files` list. max-parallel:1 guarantees the arm64 leg ran first.
            # `--publish never` is REQUIRED here: without it, electron-builder's implicit
            # publish-on-CI detection uploads this x64 latest-mac.yml and clobbers the arm64
            # feed — the exact failure this manual-merge path exists to avoid.
            npm run ${{ matrix.dist }} -- --publish never
            tag="v$(node -p "require('./package.json').version")"
            mkdir -p arm64-feed merged-feed
            # Pull the arm64-only feed the arm64 leg uploaded to the draft, then merge x64 into it.
            gh release download "$tag" -R piyushvijay/houston-releases -p latest-mac.yml -D arm64-feed --clobber
            node scripts/merge-mac-update-yml.mjs arm64-feed/latest-mac.yml release/latest-mac.yml > merged-feed/latest-mac.yml
            # Upload every x64 binary (dmg/zip/blockmaps, whatever electron-builder named them),
            # then replace the feed with the merged one. Exclude *.yml from the binary upload so
            # the x64-only latest-mac.yml is never published.
            find release -maxdepth 1 -type f ! -name '*.yml' -print0 \
              | xargs -0 gh release upload "$tag" -R piyushvijay/houston-releases --clobber
            gh release upload "$tag" merged-feed/latest-mac.yml -R piyushvijay/houston-releases --clobber
          else
            # Appends to the dist script's electron-builder invocation: --publish always
            # uploads the artifacts + latest*.yml to a DRAFT release (finalize un-drafts).
            npm run ${{ matrix.dist }} -- --publish always
          fi
      - if: matrix.os == 'macos-14'
        run: npm run test:e2e
      # Standalone CLI (README "Standalone CLI" section): one platform-independent
      # houston-cli.cjs per release. Built on the Linux leg only — the bundle is
      # pure JS, so any leg would produce the same bytes; Linux runs LAST in the
      # serialized matrix, so the draft release is guaranteed to exist before the
      # upload. On dry_run it's built (not published) and lands in the artifact.
      - name: Build standalone CLI
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run build:cli
          # A downloaded .cjs has no package manager to verify it, so ship a
          # checksum beside it: users can run `sha256sum -c houston-cli.cjs.sha256`.
          # Built here (not in the attach step) so dry_run's artifact carries it too.
          ( cd out/cli && sha256sum houston-cli.cjs > houston-cli.cjs.sha256 )
      # Software Bill of Materials (CycloneDX + SPDX) for the production dependency
      # closure, generated with Syft scanning package-lock.json directly. npm's built-in
      # `npm sbom --omit dev` was tried first but SILENTLY UNDER-REPORTS: it emitted 56 of
      # the 73 production packages, dropping genuine runtime transitives (builder-util-
      # runtime, graceful-fs, zod, https-proxy-agent, minimatch...) because npm dev-flags
      # shared packages during hoisting and then omits them — a vulnerability scanner fed
      # that SBOM would get false negatives on ~23% of the surface. Syft reads the lockfile's
      # own dev flags, excludes dev by default, and emits BOTH formats from one scan so they
      # describe an identical closure. Built on the Linux leg only (the closure is platform-
      # independent; Linux runs LAST in the serialized matrix so the draft release exists
      # before upload). This is THE per-release SBOM path: it attaches the SBOM to the
      # published Release deterministically, regardless of how the release commit landed. The
      # push-triggered sbom.yml can't be relied on for this — a GITHUB_TOKEN auto-merge never
      # starts a workflow run (so most main commits get no SBOM), and even a hand-merged
      # release PR only yields a transient 90-day Actions artifact, not a durable Release asset.
      - name: Install Syft
        if: matrix.os == 'ubuntu-22.04'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOMs (production dependency closure)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Scan the lockfile, not node_modules: syft honors its dev flags and needs no
          # install. One scan emits both formats, so CycloneDX and SPDX list the same closure.
          syft scan file:./package-lock.json \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o spdx-json=sbom.spdx.json
          # The lockfile carries no per-component hashes or author, so enrich both documents
          # in place from its own integrity (sha512) and each package's installed manifest.
          # This only ADDS fields — the complete closure syft produced is preserved exactly.
          node scripts/enrich-sbom.mjs sbom.cyclonedx.json sbom.spdx.json
          # Fail closed on a truncated document, or one enrichment left without hashes, rather
          # than attaching a hollow SBOM (same stance as scripts/verify-bundled-binaries.mjs).
          # The entry floor guards against a silent regression to a partial closure like npm
          # sbom's 56 (full production set is ~73); the hash floor catches enrichment no-op'ing.
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            node -e "const j=JSON.parse(require('node:fs').readFileSync('$f','utf8')); const items=j.components||j.packages||[]; const n=items.length; const h=items.filter(x=>(x.hashes||x.checksums||[]).length).length; if(n<60){console.error('::error::'+process.argv[1]+' has only '+n+' entries (<60) — closure looks truncated'); process.exit(1)} if(h<60){console.error('::error::'+process.argv[1]+' has only '+h+' hashed entries (<60) — enrichment did not run'); process.exit(1)} console.log(process.argv[1]+' OK ('+n+' entries, '+h+' hashed)')" "$f"
          done
      - name: Attach standalone CLI + SBOMs to the release
        if: ${{ matrix.os == 'ubuntu-22.04' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          # Upload the bundle, its checksum, and the attribution notices together:
          # the bundle inlines MIT/Apache-licensed dependencies, so the notices must
          # travel with the redistributed code (the .cjs ships no node_modules). The
          # SBOMs ship alongside so each released version carries a verifiable
          # production dependency manifest in both CycloneDX and SPDX.
          gh release upload "$tag" \
            out/cli/houston-cli.cjs \
            out/cli/houston-cli.cjs.sha256 \
            THIRD-PARTY-NOTICES.md \
            sbom.cyclonedx.json \
            sbom.spdx.json \
            -R piyushvijay/houston-releases --clobber
      # Supply-chain attestations, verifiable with `gh attestation verify <file> -R
      # piyushvijay/houston`: SLSA build provenance proves each shipped artifact was produced
      # by THIS workflow from this commit, and the SBOM attestation binds the dependency SBOM
      # to the release. Each matrix leg attests what it built (release/* is that leg's own
      # output). Skipped on dry_run (nothing is published to attest), and placed AFTER publish
      # so an attestation hiccup can't leave a half-published release.
      - name: Attest release binaries (SLSA build provenance)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'release/*'
      - name: Attest standalone CLI + SBOMs (SLSA build provenance)
        if: ${{ matrix.os == 'ubuntu-22.04' && !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            out/cli/houston-cli.cjs
            sbom.cyclonedx.json
            sbom.spdx.json
      - name: Attest the SBOM against the standalone CLI
        if: ${{ matrix.os == 'ubuntu-22.04' && !inputs.dry_run }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: out/cli/houston-cli.cjs
          sbom-path: sbom.cyclonedx.json
      # On a REAL publish the assets live on the published GitHub Release, so no Actions
      # artifact is uploaded. dry_run builds WITHOUT publishing, so upload an inspectable
      # artifact only in that case. (out/cli/houston-cli.cjs exists only on the Linux
      # leg; upload-artifact errors only when a leg matches NOTHING, so the desktop
      # patterns keep the other legs green.)
      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dryrun-${{ matrix.os }}
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            out/cli/houston-cli.cjs
            out/cli/houston-cli.cjs.sha256
            THIRD-PARTY-NOTICES.md
            sbom.cyclonedx.json
            sbom.spdx.json
          if-no-files-found: error

  finalize:
    needs: build
    if: ${{ !inputs.dry_run }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      # Tag the SOURCE repo at the released commit so the next release's note range starts here.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version + this release's notes
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pull just this version's section out of CHANGELOG.md to use as the Release body.
          VERSION="$version" node scripts/extract-changelog-section.mjs > release-notes.md
      - name: Tag source repo at released commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.meta.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - name: Publish the GitHub Release on the public repo
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          # electron-builder created this as a draft; attach the notes, un-draft, mark latest.
          gh release edit "$tag" -R piyushvijay/houston-releases \
            --draft=false --latest --notes-file release-notes.md
