name: SBOM conformance

# Reusable gate: regenerate the three SBOMs from the current lockfile and run them through the
# standards checkers, failing if any regresses. Called from nightly-build, release-prepare, and
# release-publish so a dependency change can't silently drop the shipped SBOMs below their
# conformance bar. This is the guard that would have caught the fs-extra/jsonfile/universalify
# supplier regression that broke NTIA (a nested-dedup package lost its supplier) — and the
# earlier local-vs-CI mismatches — before a release.

on:
  workflow_call:
  # Also dispatchable on its own so the full checker suite can be verified end-to-end in CI
  # without waiting for a nightly or a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # Production install: the enrichment reads each package's installed manifest (supplier +
      # copyright). Must match how sbom.yml / release-publish build the shipped SBOMs.
      - run: npm ci --omit=dev --ignore-scripts
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0
      - name: Generate + enrich the three SBOMs
        run: |
          syft scan file:./package-lock.json \
            -o cyclonedx-json@1.6=sbom.cyclonedx.json \
            -o spdx-json=sbom.spdx.json \
            -o spdx-json@3.0=sbom.spdx3.json
          node scripts/enrich-sbom.mjs sbom.cyclonedx.json sbom.spdx.json sbom.spdx3.json

      # Completeness floor — runs BEFORE the checkers below, because none of them can catch a
      # truncated closure. NTIA / FSCT3 / CycloneDX-validate are per-package field validators:
      # they ask whether each package PRESENT carries a supplier, version, and unique id. Nothing
      # in them asserts how many packages there should be, and nothing could — there is no
      # reference closure to compare against. So the exact failure this whole pipeline exists to
      # prevent (npm sbom silently emitting 56 of 73 production packages, every one of them
      # well-formed) sails through every checker green. The entry floor is the only guard against
      # it; the hash floor catches enrichment silently no-op'ing. Same fail-closed stance as
      # scripts/verify-bundled-binaries.mjs.
      #
      # Kept byte-identical to the same step in sbom.yml and release-publish.yml. That is three
      # copies on purpose: they must describe the same closure, and the planned
      # .github/actions/sbom-generate composite action lifts all three at once.
      - name: Verify SBOMs are valid and complete
        run: |
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            node -e "const j=JSON.parse(require('node:fs').readFileSync('$f','utf8')); const items=j.components||j.packages||[]; const n=items.length; const h=items.filter(x=>(x.hashes||x.checksums||[]).length).length; if(n<60){console.error('::error::'+process.argv[1]+' has only '+n+' entries (<60) — closure looks truncated'); process.exit(1)} if(h<60){console.error('::error::'+process.argv[1]+' has only '+h+' hashed entries (<60) — enrichment did not run'); process.exit(1)} console.log(process.argv[1]+' OK ('+n+' entries, '+h+' hashed)')" "$f"
          done
          # SPDX 3.0 is a JSON-LD graph: verify the package count and that enrichment gave
          # every package a supplier (the FSCT3-critical field syft omits).
          node -e "const g=(JSON.parse(require('node:fs').readFileSync('sbom.spdx3.json','utf8'))['@graph']||[]); const pk=g.filter(e=>e.type==='software_Package'); const sup=pk.filter(p=>p.suppliedBy).length; if(pk.length<60){console.error('::error::sbom.spdx3.json has only '+pk.length+' packages (<60)');process.exit(1)} if(sup<pk.length){console.error('::error::sbom.spdx3.json: '+(pk.length-sup)+' packages missing suppliedBy');process.exit(1)} console.log('sbom.spdx3.json OK ('+pk.length+' packages, all supplied)')"

      # Tool 1 — CycloneDX CLI: JSON-schema validity of the CycloneDX SBOM.
      - name: CycloneDX CLI validate
        run: |
          docker run --rm -v "$PWD:/w" cyclonedx/cyclonedx-cli:0.32.0 \
            validate --input-file /w/sbom.cyclonedx.json --fail-on-errors

      # Tool 2 — SPDX NTIA Conformance Checker: NTIA minimum elements (SPDX 2.3 + 3.0) and
      # CISA FSCT3 minimum (SPDX 3.0). Any non-conformant document fails the build.
      - name: NTIA + CISA FSCT3 conformance
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ntia-conformance-checker==5.0.3
          fail=0
          gate() {
            label="$1"; shift
            echo "== $label =="
            if ntia-checker "$@" | tee /tmp/out | grep -q "Conformant: True"; then
              echo "  PASS"
            else
              echo "::error::$label is NOT conformant"; grep -iE "provided\?|conformant:" /tmp/out || true; fail=1
            fi
          }
          gate "NTIA (SPDX 2.3)"      --comply ntia --file sbom.spdx.json
          gate "NTIA (SPDX 3.0)"      --comply ntia -s spdx3 --file sbom.spdx3.json
          gate "CISA FSCT3 (SPDX 3.0)" --comply fsct3-min -s spdx3 --file sbom.spdx3.json
          exit $fail

      # Tool 3 — Google SBOM Conformance: EO + SPDX specs. (The Google spec hard-codes
      # "Organization: Google LLC" as the creator, so it is intentionally excluded.)
      - name: Google SBOM conformance (EO + SPDX specs)
        run: |
          git clone --quiet https://github.com/google/sbom-conformance /tmp/gsc
          git -C /tmp/gsc -c advice.detachedHead=false checkout --quiet 22e1df80b49461d04733c3fc625429420618f563
          out=$(cd /tmp/gsc && GOFLAGS=-mod=mod go run . --sbom "$GITHUB_WORKSPACE/sbom.spdx.json" --specs eo,spdx)
          echo "$out"
          echo "$out" | grep -q "The EO spec passed" || { echo "::error::Google EO spec failed"; exit 1; }
          echo "$out" | grep -q "The SPDX spec passed" || { echo "::error::Google SPDX spec failed"; exit 1; }
