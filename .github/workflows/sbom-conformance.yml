name: SBOM conformance

# Reusable gate: regenerate the three SBOMs from the current lockfile and run them through the
# standards checkers, failing if any regresses. Called from ci.yml (every PR), release-prepare,
# and release-publish so a dependency change can't silently drop the shipped SBOMs below their
# conformance bar. This is the guard that would have caught the fs-extra/jsonfile/universalify
# supplier regression that broke NTIA (a nested-dedup package lost its supplier) — and the
# earlier local-vs-CI mismatches — before a release.

on:
  workflow_call:
  # Also dispatchable on its own so the full checker suite can be verified end-to-end in CI
  # without opening a PR or cutting a release.
  workflow_dispatch:

permissions:
  contents: read

# Called from CI, release-prepare and release-publish, `github.workflow` is the caller's name and
# the PR number or run id keeps each caller run in its own group, so a call never waits on or
# cancels another caller. Only a superseded run of the same PR (or a repeat dispatch) is dropped.
concurrency:
  group: sbom-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  conformance:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Production install: the enrichment reads each package's installed manifest (supplier +
      # copyright). Must match how sbom.yml / release-publish build the shipped SBOMs.
      - uses: ./.github/actions/setup-node
        with:
          install: production
      # Generate, enrich and verify the three SBOMs (the same composite sbom.yml and
      # release-publish.yml use). Its completeness floor runs BEFORE the checkers below,
      # because none of them can catch a truncated closure: see scripts/verify-sbom.mjs.
      - uses: ./.github/actions/sbom-generate

      # Tool 1 — CycloneDX CLI: JSON-schema validity of the CycloneDX SBOM.
      - name: CycloneDX CLI validate
        run: |
          # Pinned by digest, not just the tag: a tag can be re-pushed to a different image,
          # and this step runs inside the release workflow's pre-publish gate.
          docker run --rm -v "$PWD:/w" cyclonedx/cyclonedx-cli:0.32.0@sha256:9a858a15e7b0843606efc0ff19d5f7575011a5428d7f3d343b4f6cf09d8f0d4e \
            validate --input-file /w/sbom.cyclonedx.json --fail-on-errors

      # Tool 2 — SPDX NTIA Conformance Checker: NTIA minimum elements (SPDX 2.3 + 3.0) and
      # CISA FSCT3 minimum (SPDX 3.0). Any non-conformant document fails the build.
      - name: NTIA + CISA FSCT3 conformance
        run: |
          # Hash-locked (see .github/sbom-tools/requirements.txt), so a replaced release of the
          # checker or any of its dependencies fails the install instead of running here.
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes \
            -r .github/sbom-tools/requirements.txt
          fail=0
          gate() {
            label="$1"; shift
            echo "== $label =="
            if ntia-checker "$@" | tee /tmp/out | grep -q "Conformant: True"; then
              echo "  PASS"
            else
              echo "::error::$label is NOT conformant"; grep -iE "provided\?|conformant:" /tmp/out || true; fail=1
            fi
          }
          gate "NTIA (SPDX 2.3)"      --comply ntia --file sbom.spdx.json
          gate "NTIA (SPDX 3.0)"      --comply ntia -s spdx3 --file sbom.spdx3.json
          gate "CISA FSCT3 (SPDX 3.0)" --comply fsct3-min -s spdx3 --file sbom.spdx3.json
          exit $fail

      # Tool 3 — Google SBOM Conformance: EO + SPDX specs. (The Google spec hard-codes
      # "Organization: Google LLC" as the creator, so it is intentionally excluded.)
      # A pinned Go, not whatever the runner image ships, so an image update can't change the
      # toolchain under the checker. No cache: there is no go.sum in this workspace.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      # -mod=readonly: build exactly what the pinned commit's go.mod and go.sum describe, and
      # fail rather than resolve or upgrade a module on the fly.
      - name: Google SBOM conformance (EO + SPDX specs)
        run: |
          git clone --quiet https://github.com/google/sbom-conformance /tmp/gsc
          git -C /tmp/gsc -c advice.detachedHead=false checkout --quiet 22e1df80b49461d04733c3fc625429420618f563
          out=$(cd /tmp/gsc && GOFLAGS=-mod=readonly go run . --sbom "$GITHUB_WORKSPACE/sbom.spdx.json" --specs eo,spdx)
          echo "$out"
          echo "$out" | grep -q "The EO spec passed" || { echo "::error::Google EO spec failed"; exit 1; }
          echo "$out" | grep -q "The SPDX spec passed" || { echo "::error::Google SPDX spec failed"; exit 1; }
