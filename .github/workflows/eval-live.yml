name: Task evals (live)

# Scheduled live-model run of the task-level eval suite (src/main/agent/evals).
#
# THIS IS THE ONLY GUARD THAT CATCHES A QUALITY REGRESSION. The other two can't, by construction:
#
#   - The goldens catch a SHAPE change (the prompt text moved, a tool schema changed). They cannot
#     tell you the change made the agent WORSE — that judgement is a human reading the diff, and
#     `npm run goldens:update` accepts it in one command.
#   - The scripted eval driver on every PR hands the agent a correct plan, so it grades EXECUTION.
#     Gut the entire system prompt and the scripted suite still passes every task, because the
#     answer was in the script.
#
# Only a real model solving a real task measures quality. This job runs the identical fixtures with
# the script ignored, several attempts per task, and GRADES the result against the per-model baseline
# checked in under src/main/agent/evals/baselines/. A task that drops materially below its baseline
# reds this job. A live score with nothing to compare it against would just be a log line, so a
# missing baseline reds the job too, with the command to record one.
#
# WHICH MODEL. The schedule scores claude-haiku-5-5, not the provider's default model. The question
# this job answers is "did a Houston change make the agent worse", and a model that sometimes fails
# answers it: Haiku solves about 87% of the harder tasks' attempts, so there is room to regress into,
# where the larger models solve nearly everything. It is also cheap (about $1-2 a run against roughly
# fourteen times that for Opus). Dispatch the workflow with a `model` input to score another model on
# demand, e.g. the default model before a release; that model needs its own baseline, and a task its
# baseline predates is reported as unrecorded rather than failed. Dispatch with `record` to make
# that baseline here, with the repository's key: the run uploads the file as an artifact to
# review and commit.
#
# WHY IT STILL NEVER GATES A PR. The result is non-deterministic (a model can fail a task it passed
# yesterday) and metered. A flaky, billed gate on every PR would train everyone to re-run it until
# green, which is worse than no signal. Hence: a weekly scheduled run, with a tolerance sized to absorb
# one flaked attempt. A task that regresses HERE is a quality/model signal; a task that fails SCRIPTED is a
# harness regression and reds the PR that caused it.
#
# THIS WORKFLOW NEVER PUBLISHES ANYTHING (a recording run only uploads an Actions artifact):
# `permissions: contents: read`, no build/dist/release step,
# and the only secret in scope is the model API key (step-scoped, never at job level). It is a
# separate file from ci.yml for the same reason provider-canary.yml is: ci.yml's packaging
# matrix guarantees "no live API credential in scope", and folding an eval leg into it would
# erode the posture.
#
# SHELL POSTURE. The eval driver auto-approves every tool call, including an unsandboxed shell (the
# ubuntu runner has no Seatbelt and may have no bubblewrap, and `full-auto` deliberately cannot
# auto-approve an unconfined shell on its own). So a live model here really can run shell commands
# unconfined. That is contained by the runner, not by Houston: the job is an ephemeral VM, the token
# is read-only, and no publish credential is in scope. Do not add one.

on:
  schedule:
    # Mondays 09:00 UTC, an hour after provider-canary.yml (08:00), so the two don't contend.
    # Cron has no timezone; this is fixed UTC.
    #
    # WEEKLY, NOT NIGHTLY. A full run takes about an hour and a half (29 tasks, three attempts each,
    # one at a time), and a prompt or harness change that lowers task quality rarely needs catching
    # within a day. The gate reds when a task falls more than one flaked attempt below its baseline.
    - cron: '0 9 * * 1'
  # On-demand run, e.g. to score a new model the day it ships without waiting for the weekly slot.
  workflow_dispatch:
    inputs:
      model:
        description: 'Model id to score (default: claude-haiku-5-5 on anthropic, else the provider default model)'
        required: false
        type: string
      provider:
        description: 'Provider id: anthropic, openai or gemini'
        required: false
        default: 'anthropic'
        type: string
      attempts:
        description: 'Attempts per task (higher = less noise, more spend)'
        required: false
        default: '3'
        type: string
      record:
        description: 'Record a baseline for this model instead of grading against one (uploaded as an artifact to review and commit)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Don't stack a manual run on top of a scheduled one — keep the latest.
concurrency:
  group: eval-live
  cancel-in-progress: true

env:
  # No Electron runtime and no packaged browser are exercised here; skip the large browser download
  # @playwright/test's postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  evals:
    # 29 tasks of real model latency over several turns each, plus install: about 90 minutes on
    # Haiku when its baseline was recorded. A larger model dispatched by hand is slower, and the
    # suite's own budget per attempt is generous, so this bounds a pathological run rather than a
    # normal one.
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite itself throws on a missing key rather than skipping, so this can't go green
      # empty-handed. Assert it here, before the install, so a misconfigured secret reds the job at an obvious
      # step instead of surfacing as a column of identical provider errors that read like a regression.
      # The key is the chosen provider's (the `provider` input; anthropic on a scheduled run). The
      # three providers below are the ones this repository holds a key for; any other id stops
      # here, naming them, instead of running with no key.
      - name: Require the model API key
        env:
          PROVIDER: ${{ inputs.provider || 'anthropic' }}
          API_KEY: >-
            ${{ (inputs.provider || 'anthropic') == 'anthropic' && secrets.ANTHROPIC_API_KEY
            || inputs.provider == 'openai' && secrets.OPENAI_API_KEY
            || inputs.provider == 'gemini' && secrets.GEMINI_API_KEY
            || '' }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            anthropic) key_name=ANTHROPIC_API_KEY ;;
            openai) key_name=OPENAI_API_KEY ;;
            gemini) key_name=GEMINI_API_KEY ;;
            *) echo "::error::No API key is wired up for provider '$PROVIDER'. This workflow can score anthropic, openai or gemini."; exit 1 ;;
          esac
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::${key_name} is empty or unset, so the live eval suite cannot run. Set the repo secret."
            exit 1
          fi
      - uses: ./.github/actions/setup-node
        with:
          install: full
      # Drives the real model against every fixture, grades each task against the recorded baseline,
      # and prints the scorecard (per-task pass rate, baseline delta, the tools each run reached for,
      # wall-clock, and estimated spend) to the job log. Fails on a regression, on an unrecorded
      # model, or on a malformed baseline — never on a single flaked attempt.
      # On a SCHEDULED run there are no inputs, so every one of these interpolates to an empty
      # string — `env: FOO: ${{ inputs.foo }}` sets FOO='', it does not leave it unset. That is
      # exactly how a nightly once resolved an empty model id and recorded a baseline of all zeros.
      # The suite now treats an empty env var as unset (evals/config.ts) and validates the result,
      # so passing them through unconditionally is safe and keeps the dispatch inputs meaningful.
      # The model is the one exception: with no `model` input it is claude-haiku-5-5 on anthropic
      # (see WHICH MODEL above), and empty, so the provider's default, on any other provider.
      - name: Score the task evals against the baseline
        env:
          HOUSTON_EVAL_LIVE: '1'
          HOUSTON_EVAL_PROVIDER: ${{ inputs.provider }}
          HOUSTON_EVAL_MODEL: ${{ inputs.model || ((inputs.provider || 'anthropic') == 'anthropic' && 'claude-haiku-5-5' || '') }}
          HOUSTON_EVAL_ATTEMPTS: ${{ inputs.attempts }}
          # `record` scores without grading and writes the model's baseline file (the next step
          # uploads it). Empty, so unset to the suite, on every other run.
          HOUSTON_EVAL_RECORD: ${{ inputs.record && '1' || '' }}
          # Only the chosen provider's key reaches the step, exported under the name the suite
          # reads (the provider-canary.yml pattern).
          PROVIDER: ${{ inputs.provider || 'anthropic' }}
          API_KEY: >-
            ${{ (inputs.provider || 'anthropic') == 'anthropic' && secrets.ANTHROPIC_API_KEY
            || inputs.provider == 'openai' && secrets.OPENAI_API_KEY
            || inputs.provider == 'gemini' && secrets.GEMINI_API_KEY
            || '' }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            anthropic) key_name=ANTHROPIC_API_KEY ;;
            openai) key_name=OPENAI_API_KEY ;;
            gemini) key_name=GEMINI_API_KEY ;;
          esac
          export "${key_name}=${API_KEY}"
          unset API_KEY
          npm run eval
      # A recording run commits nothing (the token is read-only): the baseline it wrote is
      # uploaded for a person to review and commit, the same way as one recorded locally with
      # `npm run eval:baseline`. Both steps also run when the scoring step failed: the suite
      # writes the baseline before it reports, so a task that overran its time limit after
      # being scored would otherwise throw away a complete recording.
      - name: Collect the recorded baseline
        if: ${{ !cancelled() && inputs.record }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/baseline"
          git ls-files -z --modified --others --exclude-standard -- src/main/agent/evals/baselines \
            | xargs -0 -I{} cp {} "$RUNNER_TEMP/baseline/"
          ls -l "$RUNNER_TEMP/baseline"
      - if: ${{ !cancelled() && inputs.record }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-baseline
          retention-days: 14
          path: ${{ runner.temp }}/baseline
          if-no-files-found: error

  # Tell a human when the scheduled eval breaks — GitHub's own failure notification for a
  # scheduled run goes to github-actions[bot]. Scheduled runs only; a hand-dispatched run
  # already notifies whoever started it. See alert-on-failure.yml.
  alert:
    needs: [evals]
    if: >-
      always() && github.event_name == 'schedule'
      && !cancelled() && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      issues: write
    with:
      workflow: Task evals (live)
      failed: ${{ contains(needs.*.result, 'failure') }}
