name: Dependabot auto-queue

# Turns on auto-merge for Dependabot's patch and minor updates. On this repo auto-merge
# does not merge anything by itself: `main` is protected by a merge-queue ruleset, so
# auto-merge means "add this PR to the merge queue once its required checks pass". The
# PR still has to pass `test`, `linux-sandbox`, `build`, and `revert-guard` on its own
# head, and then again on the queue's candidate (main + the PRs ahead of it + this one),
# before anything lands. This workflow only saves a maintainer the click.
#
# Major bumps are left for a human. They are the updates that tend to need code changes
# (see the TypeScript 7 and vite 8 holds in dependabot.yml), and green CI on a major is
# weaker evidence than on a patch. That covers security updates too: a patch or minor
# security fix is queued here, a major one waits for review like any other major.
#
# WHY IT CANNOT USE GITHUB_TOKEN
#
# GitHub starts no workflow runs from events caused by GITHUB_TOKEN. Auto-merge enabled
# with it is attributed to github-actions[bot], and on this repo that request was never
# acted on: PR #32 sat with auto-merge on, every required check green and a clean merge
# state, and was never added to the queue. Even a queue entry made that way would stall,
# because the `merge_group` run that has to report the required checks on the queue's
# candidate would never start, and the entry would time out and drop. Enabling it with a
# PAT makes the request the PAT owner's, so the queue entry and its `merge_group` CI
# behave exactly as if a maintainer had clicked the button.
#
# The PAT is NOTICES_PAT, the same Dependabot secret dependabot-notices.yml pushes with.
# For this job it needs Pull requests: read and write on top of the Contents: read and
# write that the notices push already uses. It must be a Dependabot secret, not an Actions
# secret: Dependabot-triggered runs read from Dependabot secrets. If it is missing, the
# queue step fails loudly rather than skipping.
#
# WHY THIS IS SAFE TO RUN WITH A WRITE CREDENTIAL
#
# The job never checks out the repository and never runs project or dependency code. Its
# only steps are Dependabot's own metadata action (which reads the PR through the API) and
# one `gh pr merge --auto`. That is the property the retired auto-merge job lacked: it ran
# `npm ci` and `npm test` on the PR tree while holding a write credential. The PAT is
# scoped to the single queue step; the ambient workflow token stays read-only.
#
# The job is gated on BOTH the PR author and the event actor being Dependabot. The author
# check keeps it off every human PR. The actor check keeps it off a Dependabot PR that a
# human has since pushed to, since that push is no longer purely Dependabot's change.
#
# REQUIRES the repo setting "Allow auto-merge" (Settings > General). Without it the
# `gh pr merge --auto` call fails loudly, which is the intended failure mode.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only at the top level; the one job below raises exactly what it needs.
permissions:
  contents: read

concurrency:
  group: dependabot-auto-queue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-queue:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Read-only: the metadata action only reads the PR. Enabling auto-merge uses
      # NOTICES_PAT (see the header), so the ambient token needs no write scope.
      contents: read
      pull-requests: read
    steps:
      - name: Read Dependabot's update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Queue patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.NOTICES_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::NOTICES_PAT is not set as a Dependabot secret; cannot enable auto-merge."
            exit 1
          fi
          gh pr merge --auto --merge "${PR_URL}"
          echo "Auto-merge enabled (${UPDATE_TYPE}); the PR joins the merge queue once its required checks pass."
      - name: Leave major updates for review
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: echo "Not queued automatically (update type '${UPDATE_TYPE}'). A maintainer reviews and queues it."
