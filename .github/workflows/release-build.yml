name: Release - build leg

# One platform leg of a release: build and package the app (macOS legs are code-signed and
# notarized by electron-builder when `sign` is on), verify it (signature and notarization, the
# packaged-app e2e on macOS, this platform's binary SBOM and its vulnerability policy), and
# only then upload its installers and update feed into the draft. The Linux leg also builds
# the standalone CLI, the lockfile SBOMs and the release VEX, and attaches them.
#
# Two callers, the same steps in the same order:
#   release-publish.yml  sign: true,  dry_run as chosen: the real release.
#   release-prepare.yml  sign: false, dry_run: true: the same checks, before the release PR
#                        is opened, so publish finds nothing new except signing problems.
#
# It builds `ref`, the release commit. Two pipeline scripts run from the workflow's own commit,
# checked out under .pipeline/: release-draft.mjs (which only talks to the GitHub API about
# the draft) and dist-with-retry.sh (which only re-runs the build on a known macOS flake), so
# a fix to either applies to a retry, and an older release that predates them still builds.
# Everything that produces or checks a shipped file comes from `ref`.
#
# NOTHING HERE SIGNS with cosign or GPG, and the job cannot mint an OIDC token. This job runs
# `npm ci` and the build, which execute third-party dependency code; the keyless signing
# identity and the GPG release key live only in release-publish.yml's `checksums` job, which
# installs no dependencies. What this job still holds is the macOS signing material
# (step-scoped to "Package and publish" on the macOS legs): electron-builder is itself a
# dependency and signs inside the build, so that one cannot be separated from it.

on:
  workflow_call:
    inputs:
      os:
        description: Runner image for this leg.
        required: true
        type: string
      dist:
        description: The package.json dist script that builds this leg.
        required: true
        type: string
      sbom_app:
        description: The packaged-app directory this leg produces, for scripts/binary-sbom.mjs.
        required: true
        type: string
      sbom_label:
        description: Platform tag for this leg's binary SBOM, e.g. darwin-arm64.
        required: true
        type: string
      ref:
        description: The commit to build (the release commit).
        required: true
        type: string
      version:
        description: The version being built, X.Y.Z (already checked against package.json at `ref`).
        required: true
        type: string
      sign:
        description: Code-sign and notarize the macOS legs. Off in release-prepare.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Build artifacts but publish nothing.
        required: true
        type: boolean
    # The macOS signing + notarization credentials. Declared because a reusable workflow's
    # `secrets` context holds only what it declares: the leg's `environment: release` alone
    # left all five empty, and electron-builder then failed on an empty CSC_LINK. They live
    # in the `release` environment; since this job declares it, GitHub supplies the
    # environment's values for these names. Optional so the non-mac legs pass none.
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  leg:
    name: ${{ inputs.sbom_label }}
    timeout-minutes: 40
    # The macOS signing credentials (Apple notarization and the Developer ID .p12) live in
    # the `release` environment, not as repository secrets, so they are unreadable by any job
    # that does not declare it. The environment admits only runs on main, so a fork or a
    # feature branch cannot reach them even by editing this file. It has no required
    # reviewer: the human approval is release-publish's `approve` job. release-prepare's
    # unsigned legs run here too, but with `sign: false` no step ever receives the values.
    environment: release
    permissions:
      # electron-builder and gh upload into the draft release in this repo.
      contents: write
    runs-on: ${{ inputs.os }}
    # bash on every leg: the Windows runner defaults to PowerShell, which can't parse the
    # scripts below (if/elif/fi, line continuations). Git Bash ships on the Windows runner.
    defaults:
      run:
        shell: bash
    steps:
      # An empty `ref` would make the checkout below fall back to the run's own commit (main)
      # and quietly build the wrong tree; anything but a full commit SHA stops the leg.
      - name: Require the release commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-build needs the release commit's full SHA as ref, got '$REF'."
            exit 1
          fi
      # Build the release commit, never a branch tip: every leg and every check builds the same
      # commit, and it is the one the release notes describe (the caller's `source` or `plan`
      # job pinned it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # The workflow's own commit, for the release-draft script only (see the header).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .pipeline
          sparse-checkout: scripts
      # No npm download cache: a release builds from a clean download, so no cache entry
      # written by another run can flow into signed, shipped artifacts.
      - uses: ./.github/actions/setup-node
        with:
          install: full
          cache: 'false'
      # Fail the release if THIRD-PARTY-NOTICES.md drifted from the shipped closure — it's
      # attached to the release, so it must not ship stale versions next to a fresh SBOM.
      - name: Check THIRD-PARTY-NOTICES.md is current
        if: inputs.os == 'ubuntu-22.04'
        run: npm run notices:check
      # The `draft` job created the release; this reuses it and fails if there is more than
      # one, so a duplicate from any source stops the leg before it builds for 40 minutes.
      - name: Ensure a single draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: node .pipeline/scripts/release-draft.mjs ensure houston-code/houston "v$VERSION" "$REF"
      # Build only. Nothing reaches the draft until this leg's checks below have passed
      # (signature + notarization, the packaged-app e2e, the binary SBOM and its vulnerability
      # policy), so a failed leg leaves no half-uploaded installers behind. The explicit
      # `--publish never` (passed by scripts/dist-with-retry.sh) also stops electron-builder's
      # implicit publish-on-CI detection. On the macOS legs the script retries the dmg detach
      # flake ("Unable to detach device cleanly ... Resource busy"); a retry re-signs and
      # re-notarizes the app, and anything else fails at once.
      - name: Package
        env:
          # macOS code-signing + notarization. SCOPED to the macOS legs via startsWith():
          # CSC_LINK/CSC_KEY_PASSWORD are ALSO electron-builder's Windows Authenticode vars,
          # so leaking the mac .p12 to the Windows leg would make it try to sign the installer
          # with an Apple cert and fail. An empty value on non-mac legs = signing skipped there
          # (Windows/Linux stay unsigned until they get their own certs). electron-builder v26
          # auto-notarizes when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set.
          # `sign: false` (release-prepare) passes none of them and stops electron-builder from
          # probing the keychain, so the unsigned build behaves like a fresh runner's.
          CSC_LINK: ${{ inputs.sign && startsWith(inputs.os, 'macos') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && startsWith(inputs.os, 'macos') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign && startsWith(inputs.os, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.sign && startsWith(inputs.os, 'macos') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && startsWith(inputs.os, 'macos') && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.sign && 'true' || 'false' }}
          DIST: ${{ inputs.dist }}
        # The retry wrapper is pipeline (it re-runs `npm run dist:*` on a known macOS flake), so
        # it comes from .pipeline: releases older than the script can still be rebuilt.
        #
        # An empty CSC_LINK is not "no certificate" to electron-builder: it resolves the empty
        # path to the workspace and fails ("not a file"). So every signing variable that is
        # empty is unset first, and an unsigned build (release-prepare's, and the Windows and
        # Linux legs) runs exactly like PR CI's packaging, which never sets them.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          bash .pipeline/scripts/dist-with-retry.sh "$DIST"
      - name: Verify code signature + notarization
        if: startsWith(inputs.os, 'macos') && inputs.sign
        run: |
          app=$(find release -maxdepth 2 -name 'Houston.app' -type d | head -1)
          if [ -z "$app" ]; then echo "::error::no packaged Houston.app found in release/"; exit 1; fi
          echo "Verifying $app"
          # Signature integrity across the whole bundle (helpers, frameworks, binaries).
          codesign --verify --deep --strict --verbose=2 "$app"
          # Assert a Developer ID Application cert, not ad-hoc/unsigned — codesign --verify
          # passes on an ad-hoc signature, so this catches a build where signing secrets were
          # absent.
          codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application' \
            || { echo "::error::$app is not signed with a Developer ID Application certificate"; exit 1; }
          # The notarization ticket must be stapled to the bundle (offline Gatekeeper proof).
          # `stapler validate` also looks the ticket up on Apple's servers, so a dropped
          # connection fails it ("The network connection was lost", exit 68); retry before
          # failing the leg. A missing ticket fails every attempt.
          for attempt in 1 2 3; do
            if xcrun stapler validate "$app"; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::stapler validate failed 3 times for $app"; exit 1; fi
            echo "::warning::stapler validate failed (attempt $attempt of 3); retrying in 30s"
            sleep 30
          done
          # Informational only — never fail the release on spctl's flakiness.
          spctl --assess --type exec --verbose=4 "$app" \
            || echo "::warning::spctl assessment did not pass (informational only — codesign + stapler are the gates)"
      # Packaged-app smoke on BOTH macOS legs — arm64 (macos-15) and Intel (macos-15-intel) —
      # so the x64 artifact's packaged .app (its own node-pty + rg/ast-grep) is launch-tested,
      # not just arm64. resolveLaunch() picks release/mac-arm64 or release/mac accordingly.
      - if: startsWith(inputs.os, 'macos')
        run: npm run test:e2e
      # Standalone CLI (README "Standalone CLI" section): one platform-independent
      # houston-cli.cjs per release. Built on the Linux leg only — the bundle is
      # pure JS, so any leg would produce the same bytes. The release-publish `draft` job
      # created the draft before any leg started. On dry_run it's built (not published) and lands in the artifact.
      - name: Build standalone CLI
        if: inputs.os == 'ubuntu-22.04'
        run: |
          npm run build:cli
          # No separate houston-cli.cjs.sha256: the signed SHA256SUMS (the `checksums`
          # job) already lists the CLI, and an unsigned per-file checksum proved nothing
          # a tamperer couldn't also replace.
      # Software Bill of Materials (CycloneDX + SPDX) for the production dependency
      # closure, generated with Syft scanning package-lock.json directly. npm's built-in
      # `npm sbom --omit dev` was tried first but SILENTLY UNDER-REPORTS: it emitted 56 of
      # the 73 production packages, dropping genuine runtime transitives (builder-util-
      # runtime, graceful-fs, zod, https-proxy-agent, minimatch...) because npm dev-flags
      # shared packages during hoisting and then omits them — a vulnerability scanner fed
      # that SBOM would get false negatives on ~23% of the surface. Syft reads the lockfile's
      # own dev flags, excludes dev by default, and emits BOTH formats from one scan so they
      # describe an identical closure. Built on the Linux leg only (the closure is platform-
      # independent). This is THE per-release SBOM path: it attaches the SBOM to the
      # published Release deterministically, regardless of how the release commit landed. The
      # push-triggered sbom.yml can't be relied on for this: it yields a transient 90-day
      # Actions artifact, not a durable Release asset. (It also has no push trigger today; see
      # the note at the top of sbom.yml.)
      - name: Generate SBOMs (production dependency closure)
        if: inputs.os == 'ubuntu-22.04'
        uses: ./.github/actions/sbom-generate
      # Deep binary SBOM (native/runtime layer), generated PER LEG from that platform's real
      # packaged app. The lockfile SBOMs above enumerate the JavaScript closure; they
      # structurally CANNOT see the components that ship as real binaries rather than npm
      # tarballs: the Electron runtime and the Chromium + Node it embeds, the node-pty native
      # addon, the vendored rg/ast-grep CLIs, and (macOS only) the Squirrel.Mac updater
      # frameworks. A calibration run of Syft against a packaged app found ~none of these (Syft
      # has no Electron/Chromium classifier, and the Rust CLIs carry no metadata it reads), so
      # scripts/binary-sbom.mjs CONSTRUCTS the set and reads each version from the ACTUAL shipped
      # binary (Electron's compiled-in user-agent + node banner, `rg`/`ast-grep --version`,
      # node-pty's manifest, each mac framework's Info.plist) — versions a manifest never
      # reveals: the shipped Node differs from the build Node, and ripgrep 15.x hides behind the
      # @vscode/ripgrep@1.18.0 wrapper. It fail-closes if any expected native component or its
      # version is missing, the same stance as the lockfile floor above. Each leg execs its OWN
      # native binaries (so the rg/ast-grep versions come from that platform's build) and hashes
      # the exact files it ships, so a user of any platform can verify the SBOM's hashes against
      # the binaries inside their own download. bash on every leg (the Windows runner defaults to
      # PowerShell, which can't parse the line-continuations). This step runs after e2e, which
      # only rebuilds out/ — it never repackages release/, so the app dir persists.
      - name: Generate deep binary SBOM (native/runtime layer)
        env:
          SBOM_APP: ${{ inputs.sbom_app }}
          SBOM_LABEL: ${{ inputs.sbom_label }}
        run: |
          node scripts/binary-sbom.mjs --app "$SBOM_APP" --platform "$SBOM_LABEL" \
            -o cyclonedx-json="sbom.binary.${SBOM_LABEL}.cyclonedx.json" \
            -o spdx-json="sbom.binary.${SBOM_LABEL}.spdx.json"
      # Vulnerability gate for the NATIVE layer, the coverage the lockfile scan can't provide:
      # without it a Chromium/Node/ripgrep CVE is invisible to the release (the calibration run
      # flagged fixable High + a Critical in the shipped Chromium, matched via its CPE). Runs ONCE,
      # on the Linux leg: the six vuln-relevant components are identical across platforms (the
      # mac-only Squirrel frameworks carry no NVD coordinates). Post-build because it scans the
      # packaged app; the pre-build native-scan job has already checked the runtime, so what this
      # adds is node-pty, rg and ast-grep, read from the shipped binaries.
      #
      # Policy (scripts/native-vuln-policy.mjs), unlike the lockfile gate's "block every fixable
      # High/Critical": a finding only BLOCKS when we could ship the fix today (a stable Electron
      # carries it, or the component isn't Electron's). One that only a pre-release Electron fixes
      # ships as an `affected` statement in this release's VEX document, which is generated
      # here (repo assessments + those statements) into release-vex/ and is the copy attached,
      # signed and checksummed below. A failure fails the build job, so finalize never un-drafts.
      - name: Install grype
        if: inputs.os == 'ubuntu-22.04'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # Pin a Grype new enough to read the CycloneDX the pinned Syft emits.
          grype-version: v0.115.0
      - name: Scan binary SBOM + apply native-layer policy
        if: inputs.os == 'ubuntu-22.04'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          curl -fsSL --retry 3 https://releases.electronjs.org/releases.json -o electron-releases.json
          # Fetch the vulnerability database first, retried: this runs after the leg has built,
          # so a dropped connection would otherwise mean redoing the whole leg. The scan then
          # uses that database instead of checking for a newer one over the network.
          for attempt in 1 2 3; do
            if "$GRYPE" db update; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::grype db update failed 3 times"; exit 1; fi
            echo "::warning::grype db update failed (attempt $attempt of 3); retrying in 30s"
            sleep 30
          done
          GRYPE_DB_AUTO_UPDATE=false "$GRYPE" sbom:sbom.binary.linux-x64.cyclonedx.json \
            --only-fixed --vex .github/vex/houston.openvex.json -o table -o json=grype.binary.json
          mkdir -p release-vex
          node scripts/native-vuln-policy.mjs evaluate --report grype.binary.json \
            --releases electron-releases.json --summary "$GITHUB_STEP_SUMMARY" \
            --vex-in .github/vex/houston.openvex.json --vex-out release-vex/houston.openvex.json \
            --release "$(node -p "require('./package.json').version")" \
            --scope 'packaged linux-x64 app, after the build'
      # Upload this leg's installers and update feed, now that every check above passed. The
      # same files electron-builder's own publisher used to upload: installers, their blockmaps
      # (the updaters' differential downloads), and the one latest*.yml feed this platform reads.
      #
      # macOS: both legs build in parallel and each produces a latest-mac.yml listing only its
      # own arch, so neither uploads it (one would clobber the other, electron-builder#5592).
      # release-publish's `mac-feed` job merges the two into the single feed that auto-updates
      # both arches, from the artifacts saved below. The other platforms' feeds go up last, so
      # a feed never names a file that is not on the draft yet.
      - name: Upload this leg's installers to the draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*-setup.exe release/*.AppImage release/*.deb release/*.blockmap)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers found in release/"
            exit 1
          fi
          feeds=(release/latest*.yml)
          if [ "${#feeds[@]}" -ne 1 ]; then
            echo "::error::expected exactly one update feed, found ${#feeds[@]}: ${feeds[*]:-none}"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          # retry.sh: a dropped connection here would otherwise mean redoing the whole leg.
          bash .pipeline/scripts/retry.sh gh release upload "$tag" "${files[@]}" -R houston-code/houston --clobber
          case "$OS" in
            macos*) echo "Leaving ${feeds[0]} to the mac-feed job." ;;
            *) bash .pipeline/scripts/retry.sh gh release upload "$tag" "${feeds[@]}" -R houston-code/houston --clobber ;;
          esac
      - name: Save the macOS update feed for the mac-feed job
        if: startsWith(inputs.os, 'macos')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-feed-${{ inputs.sbom_label }}
          retention-days: 7
          path: release/latest-mac.yml
          if-no-files-found: error
      # The uploads above must have landed in the existing draft, not made another one.
      - name: Check the release is still a single draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: node .pipeline/scripts/release-draft.mjs check houston-code/houston "v$VERSION"
      # Fail the release if the macOS artifact isn't properly Developer-ID-signed AND
      # notarized. codesign --verify + `stapler validate` are deterministic checks (stapler
      # retried for its network lookup)
      # and GATE the release. `spctl --assess` (the full Gatekeeper policy assessment) is
      # flaky on CI runners — the reason electron-builder's gatekeeperAssess is off — so it
      # runs last, INFORMATIONAL only, and never fails the job.
      - name: Attach standalone CLI + SBOMs to the release
        if: ${{ inputs.os == 'ubuntu-22.04' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          # Upload the bundle, its checksum, and the attribution notices together:
          # the bundle inlines MIT/Apache-licensed dependencies, so the notices must
          # travel with the redistributed code (the .cjs ships no node_modules). The
          # lockfile SBOMs ship alongside so each released version carries a verifiable
          # production dependency manifest in CycloneDX + SPDX. (The per-platform deep
          # binary SBOMs are attached + signed separately, per leg — see "Attach + sign
          # the binary SBOM".) The VEX travels with them so consumers get the
          # exploitability assessment, not just the list.
          bash .pipeline/scripts/retry.sh gh release upload "$tag" \
            out/cli/houston-cli.cjs \
            THIRD-PARTY-NOTICES.md \
            sbom.cyclonedx.json \
            sbom.spdx.json \
            sbom.spdx3.json \
            release-vex/houston.openvex.json \
            -R houston-code/houston --clobber
      # This leg's own deep binary SBOM (generated above from its packaged app). The
      # platform-tagged filename means the four legs never collide, and each ships the SBOM
      # whose hashes match that platform's binaries. Signing happens later, in
      # release-publish.yml's `checksums` job, which holds the signing identity and installs no
      # dependencies.
      - name: Attach the binary SBOM
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM_LABEL: ${{ inputs.sbom_label }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          bash .pipeline/scripts/retry.sh gh release upload "$tag" \
            "sbom.binary.${SBOM_LABEL}.cyclonedx.json" "sbom.binary.${SBOM_LABEL}.spdx.json" \
            -R houston-code/houston --clobber
      # On a REAL publish the assets live on the published GitHub Release, so no Actions
      # artifact is uploaded. dry_run builds WITHOUT publishing, so upload an inspectable
      # artifact only in that case. (out/cli/houston-cli.cjs exists only on the Linux
      # leg; upload-artifact errors only when a leg matches NOTHING, so the desktop
      # patterns keep the other legs green.)
      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dryrun-${{ inputs.sbom_label }}
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            out/cli/houston-cli.cjs
            THIRD-PARTY-NOTICES.md
            sbom.cyclonedx.json
            sbom.spdx.json
            sbom.spdx3.json
            sbom.binary.*.cyclonedx.json
            sbom.binary.*.spdx.json
            release-vex/houston.openvex.json
          if-no-files-found: error
