name: CI heal

# Re-runs a PR's CI when the newest CI run on its head commit was cancelled.
#
# GitHub reads a PR's required checks from the newest check suite on the head commit. When
# several CI runs start in the same second (a PR opened with labels, which Dependabot always
# does), the ci-<PR> concurrency group can keep an older run and cancel the newest one before
# it creates any jobs. The PR then shows all four required checks as "expected" forever:
# auto-merge never enqueues it, a manual enqueue is refused, and re-running the green sibling
# does not help. PRs #558 and #577 each sat for days that way. scripts/heal-cancelled-ci.mjs
# finds those PRs and re-runs the newest cancelled run; its rules are unit-tested there.
#
# Two triggers:
#
# - A CI run on a PR finishing (`workflow_run`). That is the moment a PR becomes healable:
#   the cancelled runs end within seconds, the surviving run ends minutes later, and once
#   nothing on the commit is still running the newest suite is final. This run checks only
#   that commit's PR, so a stuck PR is re-run within a minute or two.
# - A schedule, as the backstop. GitHub throttles cron hard (the 15-minute schedule actually
#   ran about every 5 hours), so it is too slow to be the only trigger, but it catches
#   anything the first one missed. It is also the only run that fails loudly.
#
# The workflow_run run is soft-fail. A Dependabot-triggered run gets a read-only token
# unless the workflow raises it with `permissions:`, which this one does; if GitHub still
# refuses the re-run there, the script logs a warning and the schedule retries it rather
# than the job going red on every Dependabot CI completion.
#
# workflow_run is safe here: it always runs this file and this script as they are on the
# default branch, never the PR's copy, and nothing from the triggering run is executed. The
# only value taken from it is the head commit SHA, passed through env and compared, never
# interpolated into a command.
#
# THIS WORKFLOW NEVER MERGES OR PUSHES ANYTHING. It reads PRs and workflow runs and can only
# re-run a CI run that already exists on a PR's current head. The re-run is gated by the same
# required checks and merge queue as any other run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Every 15 minutes, as GitHub's scheduler allows.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# One sweep at a time, and one check per commit, so two CI runs on one PR finishing together
# cannot both re-run the same cancelled run.
concurrency:
  group: ci-heal-${{ github.event.workflow_run.head_sha || 'sweep' }}
  cancel-in-progress: false

jobs:
  heal:
    # Only CI runs for PRs. Runs on main pushes, queue candidates and the nightly have no PR
    # head to heal.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for the script
      pull-requests: read # list open PRs and their head commits
      actions: write # read CI runs, and re-run a cancelled one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          cache: 'false'
      # No `npm ci`: the script uses only node built-ins and the gh CLI on the runner.
      - name: Re-run CI where the newest run on a PR head was cancelled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOFT_FAIL: ${{ github.event_name == 'workflow_run' && '1' || '' }}
        run: node scripts/heal-cancelled-ci.mjs

  # A scheduled workflow that breaks tells no one, so alert on it like the others.
  alert:
    needs: [heal]
    if: >-
      always() && github.event_name == 'schedule'
      && !cancelled() && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      issues: write
    with:
      workflow: CI heal
      failed: ${{ contains(needs.*.result, 'failure') }}
