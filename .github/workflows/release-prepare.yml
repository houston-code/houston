name: Release - prepare

# Manual trigger. Runs the ultra-thorough gate (full test + packaging matrix on all three
# platforms), then opens a `release/vX.Y.Z` PR that bumps the MINOR (or MAJOR) version and
# carries a generated, user-facing CHANGELOG section. You review/sharpen the notes in that
# PR and merge to approve. After it merges, run "Release - publish" to build + ship.
#
# This is the only place the heavy macOS/Windows packaging matrix runs outside of release
# (per-merge CI builds Linux only), so packaging regressions on those platforms surface
# here, before a release is cut.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump for this release'
        type: choice
        options: [minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  # Never let two prepare runs race to open release PRs / compute the same version.
  group: release-prepare
  cancel-in-progress: false

jobs:
  # Ultra-thorough gate: lint + typecheck + the full unit suite AND a full signed-less
  # package build on every target platform. A release is only cut from a tree that is
  # green and buildable everywhere.
  verify:
    timeout-minutes: 30
    # windows-latest defaults `run:` steps to PowerShell; force bash for the whole matrix so a
    # bash step (e.g. a future multi-line if/else) can't silently fail only on the Windows leg.
    # Git Bash ships on the Windows runner, and macOS/Linux already default to bash.
    defaults:
      run:
        shell: bash
    # This is a pre-release GATE, not a publish: the mac legs package but must stay unsigned
    # (no signing secrets are in scope). Force electron-builder to skip signing rather than
    # probing the keychain, so the gate can't behave differently from a fresh runner. Real
    # signing + notarization happen only in release-publish.yml.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35 = our documented Linux floor), not
          # ubuntu-latest: node-pty compiles here, so the runner's glibc sets the shipped
          # app's minimum. Matches the other workflows' Linux legs. See ci.yml's `build`.
          - os: ubuntu-22.04
            dist: dist:linux
          - os: macos-14
            dist: dist:mac
          # macos-15-intel is GitHub's Intel (x64) runner — the only place the x64 mac app can
          # be built natively (node-pty + per-arch rg/ast-grep don't cross-compile). Gating the
          # release on it proves x64 packaging works. x64 mac runs only here and in the publish
          # workflow, never on per-PR CI, to keep macOS minutes off the merge path. Replaces the
          # retired macos-13 image (shut down 2025-12-04); GitHub sunsets x64 macOS after
          # macos-15 (~Fall 2027). Keep in lockstep with nightly-build / release-publish.
          - os: macos-15-intel
            dist: dist:mac:x64
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Full unit suite on every non-Windows leg (the macOS legs exercise the real Seatbelt
      # backend). Windows runs only the execution-backend suite — the broader suite has
      # macOS-shaped tests that don't run on Windows (this is the coverage the retired per-PR
      # `test-windows` job provided).
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npx vitest run src/main/sandbox
      # `--publish never` (like nightly-build) — this is a pre-release GATE, not a publish.
      # Without it, electron-builder tries to resolve the `github` publisher from
      # electron-builder.yml and fails demanding GH_TOKEN, which is intentionally absent here.
      - run: npm run ${{ matrix.dist }} -- --publish never
      # The packaged-app e2e (built .app via Playwright) runs at release time — it moved
      # off the per-merge path to save macOS minutes, so this is where it gates a release.
      # Runs on BOTH macOS legs (arm64 + Intel) so the x64 packaged app is gated too.
      - if: startsWith(matrix.os, 'macos')
        run: npm run test:e2e

  # SBOM conformance gate: NTIA / CISA FSCT3 / CycloneDX / Google-EO must all pass, or the
  # release PR is never opened (prepare `needs` it).
  sbom-conformance:
    uses: ./.github/workflows/sbom-conformance.yml

  prepare:
    needs: [verify, sbom-conformance]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Compute release version
        id: ver
        run: |
          # --no-git-tag-version edits package.json + package-lock only (no commit/tag).
          new_tag=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          version=${new_tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
      # The AI note generator needs @anthropic-ai/sdk. --ignore-scripts skips the
      # electron-rebuild postinstall (node-pty native build) — irrelevant to a pure-JS SDK
      # call and much faster. The deterministic fallback needs no deps, but installing
      # unconditionally keeps the step simple and the npm cache makes it cheap.
      - name: Install deps
        run: npm ci --ignore-scripts
      # Fail the prepare (so the release PR is never opened) if THIRD-PARTY-NOTICES.md drifted
      # from the current closure — catches staleness before the release rather than shipping it.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md \
            || { echo "::error::THIRD-PARTY-NOTICES.md is out of date — run 'npm run notices' and commit it."; exit 1; }
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          # When set, notes are AI-generated (claude-opus-4-8) from the PR bodies; otherwise
          # (or if the call fails) we fall back to the deterministic title-bucketing generator.
          # Either way the notes land in the human-reviewed release PR before they ship.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Collect PRs merged since the previous release tag (all merged PRs for the first
          # release, which has no prior tag). The tag is created by release-publish.yml.
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then
            since=$(git log -1 --format=%cI "$prev")
            echo "Previous release: $prev (merged:>$since)"
            gh pr list --state merged --base main --search "merged:>$since" \
              --limit 300 --json number,title,labels,body > prs.json
          else
            echo "No previous release tag — including all merged PRs."
            gh pr list --state merged --base main --limit 300 \
              --json number,title,labels,body > prs.json
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Generating AI release notes (claude-opus-4-8)…"
            if ! node scripts/ai-release-notes.mjs < prs.json > .release-section.md; then
              echo "::warning::AI note generation failed; falling back to the deterministic generator."
              node scripts/gen-release-notes.mjs < prs.json > .release-section.md
            fi
          else
            echo "ANTHROPIC_API_KEY not set; using the deterministic generator."
            node scripts/gen-release-notes.mjs < prs.json > .release-section.md
          fi
          # Prepend the new section above any existing CHANGELOG body.
          node -e "const fs=require('fs');import('./scripts/gen-release-notes.mjs').then(m=>{const s=fs.readFileSync('.release-section.md','utf8');const e=fs.existsSync('CHANGELOG.md')?fs.readFileSync('CHANGELOG.md','utf8'):'';fs.writeFileSync('CHANGELOG.md',m.prependToChangelog(e,s))})"
          rm -f prs.json .release-section.md
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/v$VERSION"
          git checkout -b "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -qm "release: v$VERSION"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --label release \
            --title "release: v$VERSION" \
            --body "$(cat <<EOF
          Automated release-prep PR for **v$VERSION**. Review the artifacts below, then merge it yourself.

          ## Before approving
          The notes in \`CHANGELOG.md\` are AI-drafted when \`ANTHROPIC_API_KEY\` is set, otherwise a deterministic placeholder. Either way, review them as a draft:
          1. Tighten the summary so it reads the way you would describe the release.
          2. Confirm **Required steps** covers any migration or manual action (and that nothing was invented).
          3. Sanity-check the **Breaking changes** section against the actual diff.

          ## To ship
          Merge this PR, then run the **Release - publish** workflow. It builds the full signed matrix and publishes to the public releases repo (visible to the updater).
          EOF
          )"
