name: Release - prepare

# Manual trigger, always from main. Says what to release and which version, checks it the way
# Release - publish will, and only then opens the release PR: `release-pr/vX.Y.Z` against the
# version's release line, `release/X.Y`, carrying the version bump and a generated CHANGELOG
# section. You review and sharpen the notes in that PR and merge it (with "Create a merge
# commit") to approve. Then run Release - publish with the same version. docs/RELEASING.md
# describes the whole process.
#
#   Next minor version / Next major version
#       cut main into a new release line and open its release PR
#   Patch a release
#       cut the next patch of any shipped release from its line (fixes merged there first);
#       a release from before release lines existed gets its line created at its tag
#   Update pending release
#       re-cut a version that hasn't shipped yet from its line's tip, so changes merged there
#       since (and regenerated notes) join it
#
# The checks run in Release - publish's order, on the exact commit the release PR is cut from:
# the vulnerability and SBOM gates (the same called workflows), then the four build legs
# (release-build.yml, the same steps, unsigned and uploading nothing). CI's tests run alongside.
# There is no approval, signing or notarization here. So publish should find nothing new except
# signing problems.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'What do you want to release?'
        type: choice
        options:
          - Next minor version
          - Next major version
          - Patch a release
          - Update pending release
        default: Next minor version
      version:
        description: 'The version to release, or the pending version to update (for example 0.10.0).'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Never let two prepare runs race to open release PRs or create the same line.
  group: release-prepare
  cancel-in-progress: false

jobs:
  # Validates the choice and the version against the repo's releases, release lines and
  # pending versions (scripts/release-source.mjs `plan`), and pins the exact commit every job
  # below checks and the release PR is cut from. A bad request fails here in seconds, with the
  # reason and the version that would work.
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      line: ${{ steps.plan.outputs.line }}
      create_line: ${{ steps.plan.outputs.create_line }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Require a run from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Release - prepare from main. The inputs pick the release; the branch selector only picks which copy of the workflow runs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          cache: 'false'
      - name: Plan the release
        id: plan
        env:
          CHOICE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          # pipefail: the default shell has none, and a refusal must fail the step, not leave
          # every later job with empty outputs.
          set -euo pipefail
          git fetch --quiet --tags origin \
            '+refs/heads/release/*:refs/remotes/origin/release/*' \
            '+refs/heads/release-pr/*:refs/remotes/origin/release-pr/*'
          node scripts/release-source.mjs plan | tee -a "$GITHUB_OUTPUT"
          grep '^summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  # "Patch a release" for a release from before release lines existed: create its line at the
  # release's tag and stop, since nothing has been merged to it yet. Merge the fixes into the
  # new line, then run "Patch a release" again.
  line-only:
    needs: plan
    if: needs.plan.outputs.mode == 'line-only'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    # RELEASE_PR_TOKEN lives in the `release-pr` environment (deployment branches: main only).
    environment: release-pr
    steps:
      - name: Create the release line
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          LINE: ${{ needs.plan.outputs.line }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set in the release-pr environment; cannot create $LINE."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$LINE" -f sha="$SHA" --silent
          echo "Created $LINE. Merge your fixes into it, then run Patch a release again." >> "$GITHUB_STEP_SUMMARY"

  # The same vulnerability gates Release - publish runs first, on the same commit.
  native-scan:
    needs: plan
    if: needs.plan.outputs.mode != 'line-only'
    uses: ./.github/workflows/native-vuln-scan.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
      security-events: write
      # Not used here: native-vuln-scan's `alert` job only runs on its own schedule. But GitHub
      # checks every nested job's permissions against the caller's grant at startup.
      issues: write

  # The same SBOM conformance gate Release - publish runs, on the same commit.
  sbom-conformance:
    needs: plan
    if: needs.plan.outputs.mode != 'line-only'
    uses: ./.github/workflows/sbom-conformance.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  # CI's own gate (ci.yml) on the commit being cut: lint, typecheck, license and notices, the
  # full unit suite, the Linux sandbox conformance, and workflow lint. `release: true` skips
  # its packaging and SBOM jobs, which the jobs around this one run in publish's form.
  verify:
    needs: plan
    if: needs.plan.outputs.mode != 'line-only'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release: true
    permissions:
      contents: read
      # Not used here: ci.yml's `alert` job only runs on a push to main. But GitHub checks
      # every nested job's permissions against the caller's grant at startup.
      issues: write

  # Release - publish's build legs (release-build.yml), the same steps in the same order:
  # notices, package, the packaged-app e2e on macOS, the standalone CLI, the SBOMs, the binary
  # SBOM and its vulnerability policy. Unsigned (`sign: false`), and a dry run, so nothing is
  # uploaded to a release; each leg keeps its files as an artifact. All four run in parallel.
  build:
    needs: [plan, native-scan, sbom-conformance]
    permissions:
      # Declared because the called leg declares it (GitHub refuses a nested job asking for
      # more than its caller grants). A dry run writes nothing.
      contents: write
    strategy:
      # Report every platform's problem in one run.
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            dist: dist:mac
            sbom_app: release/mac-arm64/Houston.app
            sbom_label: darwin-arm64
          - os: macos-15-intel
            dist: dist:mac:x64
            sbom_app: release/mac/Houston.app
            sbom_label: darwin-x64
          - os: windows-2025
            dist: dist:win
            sbom_app: release/win-unpacked
            sbom_label: win32-x64
          - os: ubuntu-22.04
            dist: dist:linux
            sbom_app: release/linux-unpacked
            sbom_label: linux-x64
    uses: ./.github/workflows/release-build.yml
    with:
      os: ${{ matrix.os }}
      dist: ${{ matrix.dist }}
      sbom_app: ${{ matrix.sbom_app }}
      sbom_label: ${{ matrix.sbom_label }}
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      sign: false
      dry_run: true

  # Last, and only once every check above passed: the release notes and the release PR.
  prepare:
    needs: [plan, native-scan, sbom-conformance, verify, build]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    # RELEASE_PR_TOKEN lives in the `release-pr` environment (deployment branches: main only), so
    # a workflow edited on a feature branch can't read it.
    environment: release-pr
    permissions:
      contents: read
      pull-requests: read # the notes generator reads each PR's title, labels and body
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LINE: ${{ needs.plan.outputs.line }}
      CREATE_LINE: ${{ needs.plan.outputs.create_line }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # The commit `plan` pinned and every job above checked, never a branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # The AI note generator needs @anthropic-ai/sdk; no lifecycle scripts, no cache.
      - uses: ./.github/actions/setup-node
        with:
          install: no-scripts
          cache: 'false'
      - name: Set the version
        run: |
          # Edits package.json + package-lock.json only (no commit, no tag).
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      # Fail the prepare (so the release PR is never opened) if THIRD-PARTY-NOTICES.md drifted
      # from the current closure, rather than shipping it stale.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: npm run notices:check
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When set, notes are AI-generated from the PR bodies; otherwise (or if the call
          # fails) we fall back to the deterministic title-bucketing generator. Either way the
          # notes land in the human-reviewed release PR before they ship.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin '+refs/heads/main:refs/remotes/origin/main'
          # The PRs this version brings (scripts/release-source.mjs `prs`): for X.Y.0, main's
          # merges since the previous release's cut plus the line's own; for a patch, the line's
          # merges since the previous release on it.
          numbers=$(SHA="$SHA" MAIN=refs/remotes/origin/main node scripts/release-source.mjs prs)
          echo "PRs in v$VERSION: $(echo "$numbers" | tr '\n' ' ')"
          : > prs.jsonl
          for n in $numbers; do
            gh pr view "$n" -R "$GITHUB_REPOSITORY" --json number,title,labels,body >> prs.jsonl \
              || echo "::warning::Couldn't read PR #$n; it is left out of the draft notes."
          done
          node -e "const fs=require('fs');const l=fs.readFileSync('prs.jsonl','utf8').split('\n').filter(Boolean).map(JSON.parse);fs.writeFileSync('prs.json',JSON.stringify(l))"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Generating AI release notes…"
            if ! node scripts/ai-release-notes.mjs < prs.json > .release-section.md; then
              echo "::warning::AI note generation failed; falling back to the deterministic generator."
              node scripts/gen-release-notes.mjs < prs.json > .release-section.md
            fi
          else
            echo "ANTHROPIC_API_KEY not set; using the deterministic generator."
            node scripts/gen-release-notes.mjs < prs.json > .release-section.md
          fi
          # Replace this version's section if the line already has one (an update), otherwise
          # insert it in version order.
          node scripts/changelog-upsert.mjs "$VERSION" .release-section.md CHANGELOG.md
          rm -f prs.json prs.jsonl .release-section.md
          # Each section opens with ONE summary sentence of at most 120 characters (it heads
          # the release notes and the in-app update notice). Release - publish refuses a summary
          # that misses, so flag it here for the PR reviewer.
          node scripts/check-changelog-summary.mjs "$VERSION" \
            || echo "::warning::Edit the v$VERSION summary in the release PR before merging it (see the notes above)."
      # Push the branch and open the PR with a fine-grained PAT: a branch push or PR from
      # GITHUB_TOKEN triggers no workflows, so the release PR's checks would never run. The PAT
      # is scoped to this one step: never persisted to .git/config and never in the environment
      # of the earlier npm install / note-generation steps, which run third-party code.
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set in the release-pr environment; cannot open the release PR."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CREATE_LINE" = "true" ]; then
            echo "Creating $LINE at $SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$LINE" -f sha="$SHA" --silent
          fi
          branch="release-pr/v$VERSION"
          git switch --quiet -c "$branch"
          git add package.json package-lock.json CHANGELOG.md
          # The trailer records the commit this release was cut from; Release - publish checks
          # the release PR changes nothing else on top of it.
          git commit -qm "release: v$VERSION" -m "Release-Base: $SHA"
          # --force: "Update pending release" replaces an open release PR's branch.
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$branch" --base "$LINE" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr comment "$open" -R "$GITHUB_REPOSITORY" \
              --body "Updated from \`$SHA\` (the tip of \`$LINE\`), with regenerated notes. Any edits made to the notes in this PR were replaced: check the summary again."
            echo "Updated release PR #$open for v$VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create -R "$GITHUB_REPOSITORY" --base "$LINE" --head "$branch" --label release \
            --title "release: v$VERSION" \
            --body "$(cat <<EOF
          Release PR for **v$VERSION**, cut from \`$SHA\` on \`$LINE\`. Release - prepare already ran the vulnerability and SBOM gates, CI, and every platform's build and checks on that commit.

          ## Before merging
          The notes in \`CHANGELOG.md\` are AI-drafted when \`ANTHROPIC_API_KEY\` is set, otherwise a deterministic placeholder. Either way, review them as a draft:
          1. Make the summary ONE sentence of at most 120 characters that captures the whole release. It heads the release notes and is the headline of the in-app update notice. Extra context can go in a second paragraph. The \`release-notes\` check on this PR tells you when it passes.
          2. Confirm **Required steps** covers any migration or manual action (and that nothing was invented).
          3. Sanity-check the **Breaking changes** section against the actual changes.

          Change only the notes here. Anything else (or updating this branch from \`$LINE\`) makes Release - publish refuse the release; to bring in later changes, run Release - prepare with **Update pending release** and \`$VERSION\`.

          ## To ship
          Merge this PR with **Create a merge commit** (not squash or rebase). Then run **Release - publish** with version \`$VERSION\`. It builds, signs, tags and publishes exactly this PR's commit.
          EOF
          )")
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
