name: Release - prepare

# Manual trigger. Runs CI itself as the gate (ci.yml, called as a reusable workflow: the full
# test + packaging matrix on all three platforms), then opens a `release/vX.Y.Z` PR that bumps the MINOR (or MAJOR) version and
# carries a generated, user-facing CHANGELOG section. You review/sharpen the notes in that
# PR and merge to approve. After it merges, run "Release - publish" to build + ship.
#
# Every PR already ran CI; `verify` re-runs it on the exact tree being released, so a release is never cut from main without a green run of its own.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump for this release'
        type: choice
        options: [minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  # Never let two prepare runs race to open release PRs / compute the same version.
  group: release-prepare
  cancel-in-progress: false

jobs:
  # The gate is CI itself (ci.yml, called as a reusable workflow): lint, typecheck, license and
  # notices, the full unit suite on Linux, both macOS legs and Windows, an unsigned package
  # build on every target platform, the packaged-app e2e on macOS, SBOM conformance, and
  # workflow lint. A release is only cut from a tree that passes exactly what a PR must pass.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # Not used here: ci.yml's `alert` job only runs on a push to main. But GitHub checks
      # every nested job's permissions against the caller's grant at startup, even one whose
      # `if` is false, and refuses to start the whole run if one asks for more.
      issues: write

  prepare:
    needs: [verify]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # RELEASE_PR_TOKEN lives in the `release-pr` environment (deployment branches: main only), so
    # a workflow edited on a feature branch can't read it.
    environment: release-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] pushes with this token
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-node
      - name: Compute release version
        id: ver
        run: |
          # --no-git-tag-version edits package.json + package-lock only (no commit/tag).
          new_tag=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          version=${new_tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
      # The AI note generator needs @anthropic-ai/sdk. --ignore-scripts skips the
      # electron-rebuild postinstall (node-pty native build) — irrelevant to a pure-JS SDK
      # call and much faster. The deterministic fallback needs no deps, but installing
      # unconditionally keeps the step simple and the npm cache makes it cheap.
      - name: Install deps
        run: npm ci --ignore-scripts
      # Fail the prepare (so the release PR is never opened) if THIRD-PARTY-NOTICES.md drifted
      # from the current closure — catches staleness before the release rather than shipping it.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: npm run notices:check
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          # When set, notes are AI-generated (claude-opus-4-8) from the PR bodies; otherwise
          # (or if the call fails) we fall back to the deterministic title-bucketing generator.
          # Either way the notes land in the human-reviewed release PR before they ship.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Collect PRs merged since the previous release tag (all merged PRs for the first
          # release, which has no prior tag). The tag is created by release-publish.yml.
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then
            since=$(git log -1 --format=%cI "$prev")
            echo "Previous release: $prev (merged:>$since)"
            gh pr list --state merged --base main --search "merged:>$since" \
              --limit 300 --json number,title,labels,body > prs.json
          else
            echo "No previous release tag — including all merged PRs."
            gh pr list --state merged --base main --limit 300 \
              --json number,title,labels,body > prs.json
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Generating AI release notes (claude-opus-4-8)…"
            if ! node scripts/ai-release-notes.mjs < prs.json > .release-section.md; then
              echo "::warning::AI note generation failed; falling back to the deterministic generator."
              node scripts/gen-release-notes.mjs < prs.json > .release-section.md
            fi
          else
            echo "ANTHROPIC_API_KEY not set; using the deterministic generator."
            node scripts/gen-release-notes.mjs < prs.json > .release-section.md
          fi
          # Prepend the new section above any existing CHANGELOG body.
          node -e "const fs=require('fs');import('./scripts/gen-release-notes.mjs').then(m=>{const s=fs.readFileSync('.release-section.md','utf8');const e=fs.existsSync('CHANGELOG.md')?fs.readFileSync('CHANGELOG.md','utf8'):'';fs.writeFileSync('CHANGELOG.md',m.prependToChangelog(e,s))})"
          rm -f prs.json .release-section.md
          # Each section opens with ONE summary sentence of at most 120 characters (it heads
          # the release notes and the in-app update notice). The AI draft is asked for it; flag
          # a draft that still misses, or the deterministic placeholder, for the PR reviewer.
          node scripts/check-changelog-summary.mjs "$VERSION" \
            || echo "::warning::Edit the v$VERSION summary in the release PR (see the notes above)."
      # Push the branch with GITHUB_TOKEN, but open the PR with a fine-grained PAT. A PR opened
      # by GITHUB_TOKEN triggers no workflows, so the merge queue's required checks would never
      # run on it (and GITHUB_TOKEN can't open PRs at all unless the repo/org allows it). The PAT
      # is scoped to this one step: never persisted to .git/config and never in the environment
      # of the earlier npm install / note-generation steps, which run third-party code.
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set in the release-pr environment; cannot open the release PR."
            exit 1
          fi
          branch="release/v$VERSION"
          git checkout -b "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -qm "release: v$VERSION"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --label release \
            --title "release: v$VERSION" \
            --body "$(cat <<EOF
          Automated release-prep PR for **v$VERSION**. Review the artifacts below, then merge it yourself.

          ## Before approving
          The notes in \`CHANGELOG.md\` are AI-drafted when \`ANTHROPIC_API_KEY\` is set, otherwise a deterministic placeholder. Either way, review them as a draft:
          1. Make the summary ONE sentence of at most 120 characters that captures the whole release. It heads the release notes and is the headline of the in-app update notice. Extra context can go in a second paragraph.
          2. Confirm **Required steps** covers any migration or manual action (and that nothing was invented).
          3. Sanity-check the **Breaking changes** section against the actual diff.

          ## To ship
          Merge this PR, then run the **Release - publish** workflow. It builds the full signed matrix and publishes the GitHub Release the updater reads.
          EOF
          )"
