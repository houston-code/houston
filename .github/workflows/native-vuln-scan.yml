name: Vulnerability scan

# Two independent jobs, each failing on its own policy:
#
#   deps  The production npm dependency closure (syft's lockfile scan), failing on any fixable
#         High/Critical. Dependabot alerts already list these in the Security tab, so this job
#         gates and does not upload SARIF.
#   scan  The native runtime layer, described below.
#
# The `scan` job scans the Electron runtime (and the Chromium + Node it embeds) that the lockfile pins, WITHOUT
# building anything, and applies the native-layer release policy (scripts/native-vuln-policy.mjs):
#   • a fixable High/Critical that a STABLE Electron already fixes fails the run (we are behind:
#     bump Electron);
#   • one that only a pre-release fixes is tracked, not blocking: it is uploaded to GitHub code
#     scanning (Security tab), where the alert closes itself once a later scan stops reporting it.
#
# Why this runs before the build, and daily:
#   • release-publish.yml calls it alongside its other pre-build gates, so a runtime that must be
#     upgraded fails the release in about a minute, instead of on the Linux leg's post-build scan
#     after the serialized macOS/Windows legs have built and uploaded to the draft release.
#   • The schedule catches a new Chromium/Node advisory the day grype's database learns of it,
#     not on release day. Scheduled failures file an issue (alert-on-failure.yml), since GitHub
#     notifies nobody about a red scheduled run.
#
# The `deps` job runs on the same schedule for the same reason: without it a fixable High/Critical
# in the npm closure stayed invisible until release day, then blocked the release.
#
# Runtime versions come from Electron's published release metadata for the lockfile's Electron.
# The release's post-build scan still reads them from the real packaged binary, and adds the
# components Electron does not supply (node-pty, rg, ast-grep).

on:
  workflow_call:
    inputs:
      ref:
        # The commit to check. The release workflows pass the release commit (a release line's,
        # not main's); every other run checks its own commit.
        description: 'Commit to check (defaults to the run''s own commit)'
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    # Daily, 06:00 UTC.
    - cron: '0 6 * * *'

permissions:
  contents: read

# A hand-run scan can overlap the scheduled one. Called from release-publish, `github.workflow`
# is the caller's name, so a release never shares (or cancels) the standalone group.
concurrency:
  group: vuln-scan-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Fails on a fixable High/Critical in the production npm closure. only-fixed avoids
  # dead-ending on an unpatchable finding; a finding assessed as not-exploitable is suppressed
  # via the VEX document (.github/vex/houston.openvex.json).
  deps:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # Pin a Syft that supports SPDX 3.0 output; the action default is too old.
          syft-version: v1.46.0
      - name: Generate production SBOM for scanning
        run: syft scan file:./package-lock.json -o cyclonedx-json@1.6=sbom.cyclonedx.json
      - name: Scan SBOM for vulnerabilities (fail on fixable High/Critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cyclonedx.json
          # Pin a Grype new enough to read the CycloneDX the pinned Syft emits.
          grype-version: v0.115.0
          # Findings assessed as not-exploitable are suppressed via the VEX document
          # (.github/vex/houston.openvex.json, see .github/vex/README.md).
          vex: .github/vex/houston.openvex.json
          severity-cutoff: high
          only-fixed: true
          output-format: table

  scan:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # upload the SARIF to code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          cache: 'false'
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          # Same Grype as the release gates.
          grype-version: v0.115.0
      # One snapshot per run, so the SBOM and the policy judge against the same metadata.
      - name: Fetch Electron release metadata
        run: curl -fsSL --retry 3 https://releases.electronjs.org/releases.json -o electron-releases.json
      - name: Build pre-build runtime SBOM
        run: node scripts/native-vuln-policy.mjs sbom --releases electron-releases.json -o sbom.native-runtime.cyclonedx.json
      - name: Scan with grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" sbom:sbom.native-runtime.cyclonedx.json \
            --only-fixed --vex .github/vex/houston.openvex.json \
            -o json=grype.native.json -o sarif=grype.native.sarif
      - name: Shape SARIF for code scanning
        run: node scripts/native-vuln-policy.mjs sarif --report grype.native.json --in grype.native.sarif --out native-runtime.sarif
      # Before the policy step, so tracked findings are recorded even on a run the policy fails.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: native-runtime.sarif
          category: native-runtime
      - name: Apply release policy (fail only if a stable Electron fixes it)
        run: |
          node scripts/native-vuln-policy.mjs evaluate --report grype.native.json \
            --releases electron-releases.json --summary "$GITHUB_STEP_SUMMARY" \
            --scope 'Electron runtime, before the build'

  # Scheduled runs only: see alert-on-failure.yml. A called or hand-run scan has a human actor.
  alert:
    needs: [deps, scan]
    if: >-
      always() && github.event_name == 'schedule'
      && !cancelled() && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      issues: write
    with:
      workflow: Vulnerability scan
      failed: ${{ contains(needs.*.result, 'failure') }}
