name: CI

on:
  # `labeled` is included so adding the `intentional-revert` label re-triggers the
  # run: `revert-guard` reads that label, and without a fresh run the guard would keep
  # reporting the pre-label result. (opened, synchronize, reopened are the defaults,
  # restated here since `types` replaces them.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Every merge lands through the merge queue as a real push, so this trigger fires and
  # main is genuinely re-tested after each one. That post-merge run is the backstop for
  # the case per-PR CI structurally cannot see: two PRs that are each green alone and
  # broken together. The queue makes that rare by testing the candidate it is about to
  # land (main + the PRs ahead of it + this one), but "rare" is not "impossible" — a
  # flaky-ordering or timing interaction can still slip through, and this is what
  # catches it.
  push:
    branches: [main]
  # Merge queue. GitHub builds a candidate commit (main + the PRs ahead in the queue +
  # this one) and runs the required checks against it; without this trigger those checks
  # would never report on that candidate and the queue would stall on every entry.
  #
  # The queue is enabled (a `merge-queue` ruleset on the default branch), and it replaced
  # strict "branch must be up to date" required checks. Under strict checks any merge to
  # main invalidated the up-to-date status of every other open PR, so landing N PRs cost
  # N sequential rebase-and-full-CI cycles. The queue keeps the same guarantee (the tree
  # that is tested is the tree that lands) while doing the sequencing itself.
  merge_group:

permissions:
  contents: read

# Dedupe superseded runs: a `synchronize` or `labeled` event while an earlier run on the
# same PR is still going cancels that earlier run. Merge-queue candidates and pushes to
# main have no PR number, so they fall back to run_id (a unique group per run) and are
# never cancelled by activity elsewhere.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # The e2e suite drives Electron via Playwright's `_electron` launcher, never a
  # bundled browser, so skip the large browser download `@playwright/test`'s
  # postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    timeout-minutes: 15
    # Linux unit gate: lint + typecheck + the full vitest suite. The conformance suite
    # (src/main/sandbox/conformance.test.ts) runs here against the unconfined backend (no
    # bubblewrap on this runner, so confinement-only assertions skip); the REAL bubblewrap
    # exercise is `linux-sandbox` below, and the macOS (Seatbelt) and Windows backends run
    # in the `package` matrix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # License gate: no AGPL/copyleft/source-available license anywhere in the
      # installed dependency tree, and everything that ships must satisfy the
      # permissive allowlist. Policy + exceptions live in scripts/license-gate.mjs
      # and scripts/license-gate-exceptions.json.
      - run: npm run license-gate
      # Attribution gate, alongside the license gate above: both read the installed
      # dependency closure, so this reuses the `npm ci` already done. Run unconditionally
      # rather than gated on a package-lock.json diff: the generator takes ~1s.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md \
            || { echo "::error::THIRD-PARTY-NOTICES.md is out of date — run 'npm run notices' and commit it."; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Standalone CLI: bundle + smoke (seconds). build-cli.mjs fails if electron
      # reaches the CLI bundle graph, so this gates the no-electron boundary on
      # every PR.
      - run: npm run build:cli
      - name: Smoke the standalone CLI on bare Node
        run: |
          set -euo pipefail
          # Run from a scratch dir with NO node_modules beside it: the bundle's
          # contract is that it runs on bare Node (a headless server), and running
          # it from the repo root would let any un-bundled `require` resolve against
          # the repo's installed deps and pass — masking exactly what this gates.
          iso="$(mktemp -d)"
          cp out/cli/houston-cli.cjs "$iso/"
          # --version must print the injected package version (not the "dev"
          # fallback), proving the build define landed and the bundle executes.
          ver="$(node -p "require('./package.json').version")"
          got="$(cd "$iso" && node houston-cli.cjs --version)"
          echo "houston-cli --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::CLI --version printed '$got', expected '$ver'"; exit 1; }
          # Exercise a real client path, not just --version: a `-p` run with an
          # isolated profile and no key must load the engine graph + host wiring and
          # exit non-zero with the friendly "No model configured" message — no
          # display server, no network.
          out="$(cd "$iso" && HOUSTON_DATA_DIR="$iso/profile" node houston-cli.cjs -p ping --cwd "$iso" 2>&1)" && code=0 || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::CLI -p with no key unexpectedly exited 0"; exit 1; }
          echo "$out" | grep -q "No model configured" || { echo "::error::CLI -p did not surface the expected 'No model configured' error"; exit 1; }
      - name: Smoke the CLI installer (bare `houston` on PATH)
        run: |
          set -euo pipefail
          # install-cli.mjs symlinks the built bundle into a bin dir as `houston`.
          # Point it at a scratch dir and confirm the resulting command runs — so
          # the "run it as a bare houston" path can't silently rot.
          bindir="$(mktemp -d)/bin"
          node scripts/install-cli.mjs --dir "$bindir"
          [ -L "$bindir/houston" ] || { echo "::error::installer did not create a houston symlink"; exit 1; }
          ver="$(node -p "require('./package.json').version")"
          got="$(PATH="$bindir:$PATH" houston --version)"
          echo "houston --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::bare houston --version printed '$got', expected '$ver'"; exit 1; }

  # Exercise the Linux bubblewrap backend for REAL — the macOS-bound developer can't
  # run it locally, so CI is the source of truth. Installs bubblewrap, enables
  # unprivileged user namespaces (Ubuntu restricts them via AppArmor by default), and
  # hard-probes that confinement actually works before running the conformance suite —
  # a failed probe reds the job instead of letting the suite silently skip (false green).
  linux-sandbox:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Set up bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Newer Ubuntu (24.04) restricts unprivileged userns via AppArmor; relax it
          # for this ephemeral runner so the bubblewrap backend can actually confine.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          # Hard probe: the same namespace ops the real backend uses (including the
          # network namespace, where the userns restriction bites). Fail loudly if it
          # doesn't work rather than letting the conformance suite skip and report green.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /bin/bash -c ':'
      - run: npm ci
      # HOUSTON_REQUIRE_SANDBOX makes the conformance suite assert a real backend is
      # active, so even a subtle probe/selection mismatch fails the job.
      - run: HOUSTON_REQUIRE_SANDBOX=1 npx vitest run src/main/sandbox/conformance.test.ts

  # Package the app on every platform it ships on, each on its own runner (cross-compilation
  # is impossible: native node-pty + per-(os,arch) rg/ast-grep binaries), and run the
  # platform-specific suites there:
  #   - macOS arm64 runs the full unit suite against the real Seatbelt sandbox backend.
  #   - Windows runs the execution-backend suite (scoped to src/main/sandbox: the broader
  #     suite has macOS-shaped tests that don't run on Windows).
  #   - Both macOS legs run the packaged-app e2e (Playwright driving the built .app), the
  #     only check that the asar archive, the afterPack vendored binaries, and the
  #     main/preload/renderer bridge work together in the real artifact.
  # Same matrix as release-prepare.yml / release-publish.yml, minus signing and publishing.
  package:
    name: package (${{ matrix.target }})
    timeout-minutes: 45
    # Not on push:[main]. The merge-queue candidate already ran this on the exact tree
    # that landed, so a second macOS/Windows pass after the merge would only repeat it.
    if: github.event_name != 'push'
    # windows-latest defaults `run:` steps to PowerShell; force bash for the whole matrix so a
    # bash step can't silently behave differently on the Windows leg.
    defaults:
      run:
        shell: bash
    env:
      # Validates packaging, not distribution: never sign or notarize here. No signing
      # secrets are in scope, and this stops electron-builder probing the keychain, so a
      # runner that happens to carry a signing identity can't change the output. Real
      # signing happens only in release-publish.yml.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (NOT ubuntu-latest): the native node-pty addon is compiled
          # here, so the runner's glibc sets the shipped app's minimum glibc. 22.04 = glibc
          # 2.35, our documented Linux floor (README). Keep in lockstep with the Linux legs in
          # release-prepare.yml / release-publish.yml so CI == shipped.
          - target: linux-x64
            os: ubuntu-22.04
            dist: dist:linux
          - target: mac-arm64
            os: macos-14
            dist: dist:mac
          # macos-15-intel is GitHub's Intel (x64) runner, the only place the x64 mac app
          # builds natively. GitHub sunsets x64 macOS runners after macos-15 (~Fall 2027), at
          # which point Intel needs a universal-on-arm64 build or gets dropped. Keep this label
          # in lockstep with the release workflows' Intel legs.
          - target: mac-x64
            os: macos-15-intel
            dist: dist:mac:x64
          - target: win-x64
            os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - if: matrix.target == 'mac-arm64'
        run: npm test
      - if: runner.os == 'Windows'
        run: npx vitest run src/main/sandbox
      # `--publish never` is load-bearing on merge_group. Without an explicit policy,
      # electron-builder publishes implicitly whenever it detects CI and the run is not a
      # PR, and it recognises a PR only by GITHUB_BASE_REF, which a merge-queue candidate
      # does not set. It then tries to create a GitHub release, fails for want of GH_TOKEN
      # (ci.yml holds no credential, by design), and every queue entry is ejected.
      - run: npm run ${{ matrix.dist }} -- --publish never
      - if: runner.os == 'macOS'
        run: npm run test:e2e
      # Playwright's error context and traces, so a red e2e can be diagnosed from the run.
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.target }}
          retention-days: 7
          path: test-results/
          if-no-files-found: ignore
      # Inspection-only build of this PR (never a published feed: the updater reads
      # Releases). Lets a reviewer install the PR's app without building it locally.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: houston-${{ matrix.target }}
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  # SBOM conformance (NTIA / CISA FSCT3 / CycloneDX / Google-EO) on every PR, so a
  # dependency change that drops the shipped SBOMs below the bar fails the PR that made it
  # rather than the next release.
  sbom-conformance:
    if: github.event_name != 'push'
    uses: ./.github/workflows/sbom-conformance.yml

  # The required `build` check: one stable name over the whole platform matrix and the SBOM
  # gate, so adding or renaming a matrix leg never needs a ruleset change.
  #
  # `always()` is load-bearing. A job whose dependency failed is SKIPPED by default, and a
  # skipped required check reports a PASS, so without it a red macOS leg would let the PR
  # merge. Here the job always runs and fails unless every dependency actually succeeded
  # (a skipped or cancelled dependency fails it too).
  build:
    needs: [package, sbom-conformance]
    if: ${{ always() && github.event_name != 'push' }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform leg and the SBOM gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a package leg or the SBOM gate did not succeed ($r)"; exit 1; }
          done

  # Silent-clobber guard. A PR branched off an out-of-date main can, when merged,
  # delete files and revert code that landed while it was open — and CI does not
  # notice, because the reverted features' tests are removed in the same commit. That
  # happened once: #551 reverted three merged PRs (~3,200 lines, 8 files) and main
  # stayed green. See AGENTS.md > "Avoiding silent-clobber merges".
  #
  # `actions/checkout` on a pull_request event checks out `refs/pull/N/merge`, which is
  # this PR already merged into main — so HEAD here IS the landing tree, and the guard
  # sees exactly what merging would produce against main as of this run. Main can move
  # before the queue lands the PR, but that cannot open a hole: the queue lands a real
  # three-way merge, which carries only this PR's own changes, so nothing merged after
  # this run can be reverted by it. Everything already on main, this run did see.
  #
  # A deliberate removal (dead code, a real revert) is acknowledged with the
  # `intentional-revert` label, which sets ALLOW_REVERT=1 and puts the intent on record.
  revert-guard:
    timeout-minutes: 5
    # Only meaningful on a PR: on push:[main] the merge has already happened.
    #
    # Deliberately NOT run on merge_group either, even though a queue candidate is a
    # landing tree. The `intentional-revert` override is read from the PR's labels, which
    # a merge_group event does not carry, so a legitimate revert would hit a guard it has
    # no way to acknowledge and wedge the queue. Running it on the PR loses nothing:
    # `refs/pull/N/merge` is recomputed against current main, so the guard already sees
    # the real before/after regardless of how stale the branch is.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard scans main's recent commits to decide whether a removal collides
          # with work that landed while this branch was open, so it needs real history,
          # not the default depth-1 checkout.
          fetch-depth: 0
      - name: Check this merge does not revert work already on main
        env:
          ALLOW_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'intentional-revert') && '1' || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin main
          node scripts/merge-revert-guard.mjs origin/main HEAD
