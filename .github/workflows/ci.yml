name: CI

on:
  # `labeled` is included so adding the `intentional-revert` label re-triggers the
  # run: `revert-guard` reads that label, and without a fresh run the guard would keep
  # reporting the pre-label result. (opened, synchronize, reopened are the defaults,
  # restated here since `types` replaces them.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Every merge lands through the merge queue as a real push, so this trigger fires and
  # main is genuinely re-tested after each one. That post-merge run is the backstop for
  # the case per-PR CI structurally cannot see: two PRs that are each green alone and
  # broken together. The queue makes that rare by testing the candidate it is about to
  # land (main + the PRs ahead of it + this one), but "rare" is not "impossible" — a
  # flaky-ordering or timing interaction can still slip through, and this is what
  # catches it.
  push:
    branches: [main]
  # Merge queue. GitHub builds a candidate commit (main + the PRs ahead in the queue +
  # this one) and runs the required checks against it; without this trigger those checks
  # would never report on that candidate and the queue would stall on every entry.
  #
  # The queue is enabled (a `merge-queue` ruleset on the default branch), and it replaced
  # strict "branch must be up to date" required checks. Under strict checks any merge to
  # main invalidated the up-to-date status of every other open PR, so landing N PRs cost
  # N sequential rebase-and-full-CI cycles. The queue keeps the same guarantee (the tree
  # that is tested is the tree that lands) while doing the sequencing itself.
  merge_group:

permissions:
  contents: read

env:
  # The e2e suite drives Electron via Playwright's `_electron` launcher, never a
  # bundled browser, so skip the large browser download `@playwright/test`'s
  # postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Decide whether this PR can possibly affect the app. A change confined to the
  # marketing site or standalone prose is covered by none of the heavy jobs — eslint
  # ignores `website/**`, no tsconfig includes it, nothing packages it — yet it was
  # paying ~7 minutes of wall clock for `test` plus `build`, and paying it again on
  # every rebase.
  #
  # Read scripts/ci-scope.mjs before widening the allowlist. A job skipped by `if:`
  # reports its required check as a PASS, so a wrong answer here does not turn CI red,
  # it lets an untested change merge. The rule is an allowlist that must match EVERY
  # changed path, and anything unrecognised means "run everything".
  #
  # Only `pull_request` is scoped. A push to main and a merge-queue candidate always run
  # the full suite: those are the trees that ship, and the few minutes are worth it.
  scope:
    # Dedupe superseded runs like the jobs below, so a rapid second push does not leave a
    # full-history clone running for a run whose dependents were already cancelled.
    concurrency:
      group: ci-scope-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 5
    # NEVER give this job an `if:`. Its consumers use `needs: scope`, and a job whose
    # dependency is skipped is skipped too — which for a required check reports a PASS.
    # Gating this job to pull requests would therefore silently stop running `test` and
    # `linux-sandbox` on main and on merge-queue candidates, while reporting them green.
    runs-on: ubuntu-latest
    outputs:
      # Empty on non-PR events (the step below is skipped), and every consumer tests
      # `!= 'true'`, so anything other than a definite "inert" runs the full suite.
      inert: ${{ steps.scope.outputs.inert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Only a pull request is ever scoped, so main and queue candidates skip the clone
        # rather than paying full history to compute an answer nothing reads. The JOB
        # still runs on those events (see above) — only this step is conditional.
        if: github.event_name == 'pull_request'
        with:
          # Needed for a real merge-base. A depth-1 checkout cannot compute `base...HEAD`,
          # and the script treats a failed diff as "run everything" — correct, but it
          # would silently never scope anything.
          fetch-depth: 0
      - id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          node scripts/ci-scope.mjs "origin/$BASE"

  test:
    # Dedupe superseded runs: a `labeled` or `synchronize` event while an earlier run
    # is still going cancels that earlier run instead of both billing in parallel.
    # Keyed per-PR. Non-PR runs (push:[main]) fall back to run_id — a unique group per
    # run — so they never cancel one another, and a post-merge run on main is never
    # torn down by activity on some other PR.
    concurrency:
      group: ci-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    needs: scope
    # Skipped only when every changed path is on the allowlist in scripts/ci-scope.mjs.
    # `!cancelled()` rather than a bare condition: if `scope` FAILS, this job would
    # otherwise be skipped for an unsatisfied `needs`, and a skipped required check
    # reports a PASS — a broken scope job would silently mark an untested PR mergeable.
    # With this guard a failed scope leaves `inert` empty, which runs the full suite.
    if: ${{ !cancelled() && needs.scope.outputs.inert != 'true' }}
    # Per-PR unit gate — Linux only (×1). lint + typecheck + the full vitest suite. The
    # conformance suite (src/main/sandbox/conformance.test.ts) runs here against the
    # unconfined backend (no bubblewrap on this runner, so confinement-only assertions
    # skip); the REAL Linux bubblewrap exercise is the dedicated `linux-sandbox` job below.
    # The macOS leg (real Seatbelt backend) and the Windows execution-backend suite moved
    # OFF the per-PR path to nightly-build.yml + release-prepare.yml — they bill macOS ×10 /
    # Windows ×2 and shouldn't sit on every push. Trade-off: a macOS- or Windows-specific
    # unit regression surfaces nightly / at release, not on the PR that introduced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # License gate: no AGPL/copyleft/source-available license anywhere in the
      # installed dependency tree, and everything that ships must satisfy the
      # permissive allowlist. Policy + exceptions live in scripts/license-gate.mjs
      # and scripts/license-gate-exceptions.json.
      - run: npm run license-gate
      # Attribution gate, alongside the license gate above: both read the installed
      # dependency closure, so this reuses the `npm ci` already done. Nightly + the
      # release workflows run the same check, but only catching drift there means a
      # dep bump merges green and reddens the NEXT nightly instead of its own PR —
      # which is exactly what happened when @anthropic-ai/sdk 0.111.0 landed. Run
      # unconditionally rather than gated on a package-lock.json diff: the generator
      # takes ~1s, while detecting whether the lockfile changed would need the base
      # ref fetched (fetch-depth: 0) and cost more than the check it guards.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md \
            || { echo "::error::THIRD-PARTY-NOTICES.md is out of date — run 'npm run notices' and commit it."; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Standalone CLI: bundle + smoke (seconds). build-cli.mjs fails if electron
      # reaches the CLI bundle graph, so this gates the no-electron boundary on
      # every PR.
      - run: npm run build:cli
      - name: Smoke the standalone CLI on bare Node
        run: |
          set -euo pipefail
          # Run from a scratch dir with NO node_modules beside it: the bundle's
          # contract is that it runs on bare Node (a headless server), and running
          # it from the repo root would let any un-bundled `require` resolve against
          # the repo's installed deps and pass — masking exactly what this gates.
          iso="$(mktemp -d)"
          cp out/cli/houston-cli.cjs "$iso/"
          # --version must print the injected package version (not the "dev"
          # fallback), proving the build define landed and the bundle executes.
          ver="$(node -p "require('./package.json').version")"
          got="$(cd "$iso" && node houston-cli.cjs --version)"
          echo "houston-cli --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::CLI --version printed '$got', expected '$ver'"; exit 1; }
          # Exercise a real client path, not just --version: a `-p` run with an
          # isolated profile and no key must load the engine graph + host wiring and
          # exit non-zero with the friendly "No model configured" message — no
          # display server, no network.
          out="$(cd "$iso" && HOUSTON_DATA_DIR="$iso/profile" node houston-cli.cjs -p ping --cwd "$iso" 2>&1)" && code=0 || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::CLI -p with no key unexpectedly exited 0"; exit 1; }
          echo "$out" | grep -q "No model configured" || { echo "::error::CLI -p did not surface the expected 'No model configured' error"; exit 1; }
      - name: Smoke the CLI installer (bare `houston` on PATH)
        run: |
          set -euo pipefail
          # install-cli.mjs symlinks the built bundle into a bin dir as `houston`.
          # Point it at a scratch dir and confirm the resulting command runs — so
          # the "run it as a bare houston" path can't silently rot.
          bindir="$(mktemp -d)/bin"
          node scripts/install-cli.mjs --dir "$bindir"
          [ -L "$bindir/houston" ] || { echo "::error::installer did not create a houston symlink"; exit 1; }
          ver="$(node -p "require('./package.json').version")"
          got="$(PATH="$bindir:$PATH" houston --version)"
          echo "houston --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::bare houston --version printed '$got', expected '$ver'"; exit 1; }

  # Exercise the Linux bubblewrap backend for REAL — the macOS-bound developer can't
  # run it locally, so CI is the source of truth. Installs bubblewrap, enables
  # unprivileged user namespaces (Ubuntu restricts them via AppArmor by default), and
  # hard-probes that confinement actually works before running the conformance suite —
  # a failed probe reds the job instead of letting the suite silently skip (false green).
  linux-sandbox:
    # Dedupe opened+labeled / superseded synchronize runs per-PR (see `test`).
    # Distinct group prefix so it cancels only its own stale runs, never
    # `test`/`build`; run_id fallback keeps push:[main] runs unique.
    concurrency:
      group: ci-linux-sandbox-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 15
    needs: scope
    # See `test`, including why this is `!cancelled()` and not a bare condition.
    if: ${{ !cancelled() && needs.scope.outputs.inert != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Set up bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Newer Ubuntu (24.04) restricts unprivileged userns via AppArmor; relax it
          # for this ephemeral runner so the bubblewrap backend can actually confine.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          # Hard probe: the same namespace ops the real backend uses (including the
          # network namespace, where the userns restriction bites). Fail loudly if it
          # doesn't work rather than letting the conformance suite skip and report green.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /bin/bash -c ':'
      - run: npm ci
      # HOUSTON_REQUIRE_SANDBOX makes the conformance suite assert a real backend is
      # active, so even a subtle probe/selection mismatch fails the job.
      - run: HOUSTON_REQUIRE_SANDBOX=1 npx vitest run src/main/sandbox/conformance.test.ts

  # NOTE: the Windows execution-backend suite (`npx vitest run src/main/sandbox`) moved off
  # the per-PR path — it now runs in nightly-build.yml and release-prepare.yml (Windows bills
  # ×2). Same for the macOS Seatbelt leg of `test`. Per-PR CI keeps the real LINUX sandbox
  # exercise (`linux-sandbox` below, ×1) since it's cheap.

  # Per-PR packaging smoke — Linux x64 ONLY (×1 Actions-minute multiplier). Proves the
  # afterPack vendored-binary copy + asar packaging still succeed on every PR without
  # burning macOS (×10) or Windows (×2) minutes. The FULL signed macOS/Windows/Linux
  # matrix is built and published at release time by release-publish.yml, and the heavy
  # matrix also runs in release-prepare.yml before a release is cut — so macOS/Windows
  # packaging regressions surface there. This job is a required status check, so a PR that
  # breaks Linux packaging can't be merged. Cross-compilation is impossible (native
  # node-pty + per-(os,arch) rg/ast-grep binaries), which is why a single runner can only
  # validate its own platform. Trade-off: the macOS packaged-app e2e moved to release time.
  build:
    # Dedupe opened+labeled / superseded synchronize runs per-PR (see `test`).
    # Distinct group prefix so it cancels only its own stale runs; run_id fallback
    # keeps push:[main] runs unique. (build is pull_request-only, so run_id is just
    # a safety net — no push run ever reaches this job.)
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 25
    # `needs: test` also carries the scoping: when `test` is skipped as inert, this job
    # is skipped with it, so packaging is not rebuilt for a website copy change.
    needs: test
    # Runs on every PR AND on every merge-queue candidate: packaging is a real check, and
    # a candidate that cannot be packaged must not reach main. Skipped on push:[main]
    # because the packaged artifacts for main come from nightly-build.yml instead.
    if: github.event_name != 'push'
    # Pinned to ubuntu-22.04 (NOT ubuntu-latest): the native node-pty addon is compiled here,
    # so the runner's glibc sets the shipped app's minimum glibc. 22.04 = glibc 2.35, our
    # documented Linux floor (README). ubuntu-latest tracks the newest image (24.04 → glibc
    # 2.39), which would silently raise that floor. Keep this in lockstep with the Linux legs
    # in nightly-build.yml / release-prepare.yml / release-publish.yml so smoke == shipped.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Packaging smoke ONLY — prove `dist:linux` (electron-builder + the afterPack vendored
      # binaries) succeeds. No artifact is uploaded per PR: it was inspection-only and nothing
      # consumes it. `npm run dist:linux` exits non-zero on any packaging failure, so the job
      # still gates merge. Inspectable build outputs come from nightly-build.yml (uploaded as
      # artifacts) and release-publish.yml (published as a GitHub Release) instead.
      - run: npm run dist:linux
  # Silent-clobber guard. A PR branched off an out-of-date main can, when merged,
  # delete files and revert code that landed while it was open — and CI does not
  # notice, because the reverted features' tests are removed in the same commit. That
  # happened once: #551 reverted three merged PRs (~3,200 lines, 8 files) and main
  # stayed green. See AGENTS.md > "Avoiding silent-clobber merges".
  #
  # `actions/checkout` on a pull_request event checks out `refs/pull/N/merge`, which is
  # this PR already merged into main — so HEAD here IS the landing tree, and the guard
  # sees exactly what merging would produce against main as of this run. Main can move
  # before the queue lands the PR, but that cannot open a hole: the queue lands a real
  # three-way merge, which carries only this PR's own changes, so nothing merged after
  # this run can be reverted by it. Everything already on main, this run did see.
  #
  # A deliberate removal (dead code, a real revert) is acknowledged with the
  # `intentional-revert` label, which sets ALLOW_REVERT=1 and puts the intent on record.
  revert-guard:
    timeout-minutes: 5
    # Only meaningful on a PR: on push:[main] the merge has already happened.
    #
    # Deliberately NOT run on merge_group either, even though a queue candidate is a
    # landing tree. The `intentional-revert` override is read from the PR's labels, which
    # a merge_group event does not carry, so a legitimate revert would hit a guard it has
    # no way to acknowledge and wedge the queue. Running it on the PR loses nothing:
    # `refs/pull/N/merge` is recomputed against current main, so the guard already sees
    # the real before/after regardless of how stale the branch is.
    #
    # NOT scoped by `scope` either. It is 8 seconds and it is the one check that is more
    # valuable, not less, on a branch that has been open long enough to go stale.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard scans main's recent commits to decide whether a removal collides
          # with work that landed while this branch was open, so it needs real history,
          # not the default depth-1 checkout.
          fetch-depth: 0
      - name: Check this merge does not revert work already on main
        env:
          ALLOW_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'intentional-revert') && '1' || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin main
          node scripts/merge-revert-guard.mjs origin/main HEAD
