name: CI

on:
  # `labeled` is included so adding the `auto-merge` label triggers a run that
  # sees it: when a PR is opened and labeled near-simultaneously, the `opened`
  # event payload can miss the label and the label-gated jobs skip. (opened,
  # synchronize, reopened are the defaults, restated here since `types` replaces them.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The e2e suite drives Electron via Playwright's `_electron` launcher, never a
  # bundled browser, so skip the large browser download `@playwright/test`'s
  # postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    # Run the suite on Linux AND macOS. The sandbox conformance suite
    # (src/main/sandbox/conformance.test.ts) exercises the real OS sandbox where one
    # exists: the macOS leg verifies the Seatbelt backend end-to-end. This ubuntu leg
    # has no bubblewrap installed, so it uses the unconfined backend and the
    # confinement-only assertions skip — the real bubblewrap exercise is the dedicated
    # `linux-sandbox` job below. macos-14 is arm64, matching the build target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Exercise the Linux bubblewrap backend for REAL — the macOS-bound developer can't
  # run it locally, so CI is the source of truth. Installs bubblewrap, enables
  # unprivileged user namespaces (Ubuntu restricts them via AppArmor by default), and
  # hard-probes that confinement actually works before running the conformance suite —
  # a failed probe reds the job instead of letting the suite silently skip (false green).
  linux-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Set up bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Newer Ubuntu (24.04) restricts unprivileged userns via AppArmor; relax it
          # for this ephemeral runner so the bubblewrap backend can actually confine.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          # Hard probe: the same namespace ops the real backend uses (including the
          # network namespace, where the userns restriction bites). Fail loudly if it
          # doesn't work rather than letting the conformance suite skip and report green.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /bin/bash -c ':'
      - run: npm ci
      # HOUSTON_REQUIRE_SANDBOX makes the conformance suite assert a real backend is
      # active, so even a subtle probe/selection mismatch fails the job.
      - run: HOUSTON_REQUIRE_SANDBOX=1 npx vitest run src/main/sandbox/conformance.test.ts

  # Exercise the Windows execution backend for REAL (the macOS-bound developer can't run
  # it locally). Scoped to the sandbox suite — the broader Node suite has macOS-shaped
  # tests that have never run on Windows; this leg proves the Windows backend's declared
  # contract (sandboxed:false, commands run, exit codes, timeout teardown) against the
  # runner's bundled Git Bash. windows-latest ships Git for Windows + an MSVC toolchain
  # (so node-pty's postinstall rebuild succeeds).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx vitest run src/main/sandbox

  # Package the app for each OS (macOS arm64, Windows x64, Linux x64) on every PR set
  # to auto-merge. Cross-compilation is impossible — native node-pty + per-(os,arch)
  # rg/ast-grep binaries — so each OS builds its own artifacts on its own runner. We
  # build on the pull_request event (which checks out the merge ref = the state about
  # to land); a push-to-main build can't run because the auto-merge job pushes with
  # GITHUB_TOKEN, which doesn't trigger a new workflow run. This validates that packaging
  # + the afterPack vendored-binary copy succeed on every OS, and it gates merge: it's in
  # auto-merge's `needs`, so a PR that breaks packaging on any platform won't auto-merge.
  # x64 mac + arm64 win/linux are follow-ups (each needs its own runner).
  build:
    needs: test
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            dist: dist:mac
            artifact: houston-mac-arm64
          - os: windows-latest
            dist: dist:win
            artifact: houston-win-x64
          - os: ubuntu-latest
            dist: dist:linux
            artifact: houston-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist }}
      # Smoke-test the packaged macOS app: the spec launches the built .app via
      # Playwright (_electron) and asserts the renderer mounts — exercising the asar
      # archive, the afterPack vendored binaries, and the main ↔ preload ↔ renderer
      # bridge end to end. macOS has a display without xvfb; Windows/Linux e2e is a
      # follow-up (Linux needs xvfb), and the package build itself is the smoke test there.
      - if: matrix.os == 'macos-14'
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  auto-merge:
    # `needs` makes this run AFTER the known jobs (and skip cleanly if one fails), but
    # the enumerated list is NOT the merge gate — the "Require all CI checks to pass"
    # step below is. That step verifies EVERY check on the PR succeeded, so a CI job
    # that fails (or is still running) blocks the merge even if it was never added here.
    needs: [test, linux-sandbox, test-windows, build]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    # A PR opened *and* labeled at once can spawn two CI runs for the same PR (see
    # the `on:` comment). Without this, both runs' auto-merge jobs fire `gh pr merge`
    # at once and the loser dies with "merge already in progress", reddening a PR that
    # merged fine. Serialize auto-merge per-PR so the second job waits for the first
    # instead of racing it. cancel-in-progress is false on purpose: cancelling could
    # tear down a mid-merge job, and we never want to lose the run carrying the label.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # checks/statuses read are REQUIRED for `gh ... --json statusCheckRollup` below:
      # an explicit permissions block defaults everything unlisted to `none`, and
      # without these the rollup fetch fails (the job can't read other jobs' check runs).
      checks: read
      statuses: read
    steps:
      # The real merge gate: refuse to merge unless EVERY other check on this PR's head
      # has completed successfully. Self-maintaining — a CI job that fails (or is still
      # running) blocks the merge even if it was never listed in `needs`, which is the
      # hole that previously let a PR merge with a failing job. We exclude this
      # auto-merge job's own check(s) (IN_PROGRESS while this runs) to avoid waiting on
      # ourselves, and poll so a check that hasn't finished yet doesn't read as "passed".
      - name: Require all CI checks to pass
        run: |
          fetch_fails=0
          for attempt in $(seq 1 80); do   # up to ~40 min at 30s intervals
            ROLLUP=$(gh pr view "$PR" --json statusCheckRollup --jq '
              [ .statusCheckRollup[]
                | select((.name // .context) != "auto-merge")
                | { name: (.name // .context),
                    done: (if .__typename == "CheckRun" then (.status == "COMPLETED") else (.state != "PENDING" and .state != "EXPECTED") end),
                    ok:   (if .__typename == "CheckRun"
                           then (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED")
                           else (.state == "SUCCESS") end) } ]') || ROLLUP=""
            # Fail loud after a few consecutive fetch failures instead of looping the
            # full timeout — a persistent failure means a real problem (e.g. token perms).
            if [ -z "$ROLLUP" ]; then
              fetch_fails=$((fetch_fails + 1))
              if [ "$fetch_fails" -ge 5 ]; then
                echo "::error::Could not read the check rollup after $fetch_fails attempts (token permissions or a gh/API error). Aborting rather than hanging."
                exit 1
              fi
              echo "check rollup fetch failed ($fetch_fails/5); retrying"; sleep 15; continue
            fi
            fetch_fails=0
            PENDING=$(echo "$ROLLUP" | jq '[.[] | select(.done | not)] | length')
            if [ "$PENDING" -gt 0 ]; then
              echo "Waiting on $PENDING in-progress check(s)…"
              sleep 30
              continue
            fi
            FAILED=$(echo "$ROLLUP" | jq -r '[.[] | select(.ok | not) | .name] | join(", ")')
            if [ -n "$FAILED" ]; then
              echo "::error::Not merging PR #$PR — these CI checks did not pass: $FAILED"
              exit 1
            fi
            echo "All CI checks passed — proceeding to merge."
            exit 0
          done
          echo "::error::Timed out waiting for PR #$PR CI checks to complete."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
      # Idempotent merge. `gh pr merge` exits non-zero for several reasons; only a
      # genuinely un-merged PR should fail the job. After a non-zero exit we confirm
      # the PR's state (polling briefly, since a concurrent run's merge may still be
      # committing) and exit 0 if it's MERGED — otherwise stay red so real failures
      # (conflicts, failing required checks) surface. `|| state=UNKNOWN` keeps a flaky
      # `gh pr view` from aborting the step under `set -eo pipefail`.
      - run: |
          if gh pr merge "$PR" --merge --delete-branch; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$PR" --json state --jq .state) || state=UNKNOWN
            if [ "$state" = "MERGED" ]; then
              echo "::warning::PR #$PR is MERGED but 'gh pr merge' exited non-zero (a concurrent run merged it, or --delete-branch failed). Verify the head branch was removed."
              exit 0
            fi
            echo "Attempt $attempt: PR #$PR state=$state (not yet MERGED); waiting for any in-flight merge."
            sleep 3
          done
          echo "::error::Merge failed and PR #$PR is not merged (state=$state)."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
