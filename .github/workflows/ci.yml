name: CI

on:
  # `labeled` is included so adding the `intentional-revert` label re-triggers the
  # run: `revert-guard` reads that label, and without a fresh run the guard would keep
  # reporting the pre-label result. (opened, synchronize, reopened are the defaults,
  # restated here since `types` replaces them.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Every merge lands through the merge queue as a real push, so this trigger fires and
  # main is genuinely re-tested after each one. That post-merge run is the backstop for
  # the case per-PR CI structurally cannot see: two PRs that are each green alone and
  # broken together. The queue makes that rare by testing the candidate it is about to
  # land (main + the PRs ahead of it + this one), but "rare" is not "impossible" — a
  # flaky-ordering or timing interaction can still slip through, and this is what
  # catches it.
  push:
    branches: [main]
  # Merge queue. GitHub builds a candidate commit (main + the PRs ahead in the queue +
  # this one) and runs the required checks against it; without this trigger those checks
  # would never report on that candidate and the queue would stall on every entry.
  #
  # The queue is enabled (a `merge-queue` ruleset on the default branch), and it replaced
  # strict "branch must be up to date" required checks. Under strict checks any merge to
  # main invalidated the up-to-date status of every other open PR, so landing N PRs cost
  # N sequential rebase-and-full-CI cycles. The queue keeps the same guarantee (the tree
  # that is tested is the tree that lands) while doing the sequencing itself.
  merge_group:
  # Nightly on main: the full package matrix, including the macOS Intel leg that PRs and
  # queue candidates no longer run (scripts/ci-plan.mjs says why), and a refresh of the
  # main-scoped package caches, which those legs save on a miss.
  schedule:
    - cron: '17 7 * * *'
  # A manual run of the nightly matrix (`gh workflow run ci.yml`), to check a fix for a
  # nightly-only failure such as the Intel leg without waiting for the schedule. It has no
  # diff to plan from, so scripts/ci-plan.mjs gives it every leg and the action test. It
  # files no alert: whoever started it is watching it.
  workflow_dispatch:
  # Release - prepare calls this workflow as its verification gate, so a release is cut only
  # from a tree that passes exactly what a PR must pass. It passes the exact commit the
  # release is cut from (`ref`: for a patch, a release line's commit, not main's), and
  # `release: true` skips the packaging and SBOM jobs, because prepare runs release-publish's
  # own versions of them (release-build.yml, sbom-conformance.yml) in publish's order.
  workflow_call:
    inputs:
      ref:
        description: Commit to test (defaults to the run's own commit).
        type: string
        default: ''
      release:
        description: Called from release-prepare, which packages through release-build.yml.
        type: boolean
        default: false

permissions:
  contents: read

# Dedupe superseded runs: a `synchronize` or `labeled` event while an earlier run on the
# same PR is still going cancels that earlier run. Merge-queue candidates and pushes to
# main have no PR number, so they fall back to run_id (a unique group per run) and are
# never cancelled by activity elsewhere.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # The e2e suite drives Electron via Playwright's `_electron` launcher, never a
  # bundled browser, so skip the large browser download `@playwright/test`'s
  # postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    timeout-minutes: 15
    # Linux unit gate: lint + typecheck + the full vitest suite. The conformance suite
    # (src/main/sandbox/conformance.test.ts) runs here against the unconfined backend (no
    # bubblewrap on this runner, so confinement-only assertions skip); the REAL bubblewrap
    # exercise is `linux-sandbox` below, and the macOS (Seatbelt) and Windows backends run
    # in the `package` matrix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          install: full
          electron-cache: headers
      # License gate: no AGPL/copyleft/source-available license anywhere in the
      # installed dependency tree, and everything that ships must satisfy the
      # permissive allowlist. Policy + exceptions live in scripts/license-gate.mjs
      # and scripts/license-gate-exceptions.json.
      - run: npm run license-gate
      # Attribution gate, alongside the license gate above: both read the installed
      # dependency closure, so this reuses the `npm ci` already done. Run unconditionally
      # rather than gated on a package-lock.json diff: the generator takes ~1s.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: npm run notices:check
      - run: npm run lint
      - run: npm run typecheck
      # JUnit for the uploaded report; github-actions for inline failure annotations (naming
      # any reporter turns off vitest's automatic one, so it is listed explicitly).
      # --coverage enforces the per-directory floors in vitest.config.ts. Linux only: the
      # suite is the same on every OS, so the macOS and Windows legs in `package` skip the
      # instrumentation cost. text-summary keeps the log short; run `npm run
      # test:coverage` locally for the per-file table and HTML report.
      - run: npm test -- --coverage --coverage.reporter=text-summary --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux
          retention-days: 7
          path: reports/junit.xml
          if-no-files-found: ignore
      # Standalone CLI: bundle + smoke (seconds). build-cli.mjs fails if electron
      # reaches the CLI bundle graph, so this gates the no-electron boundary on
      # every PR.
      - run: npm run build:cli
      - name: Smoke the standalone CLI on bare Node
        run: |
          set -euo pipefail
          # Run from a scratch dir with NO node_modules beside it: the bundle's
          # contract is that it runs on bare Node (a headless server), and running
          # it from the repo root would let any un-bundled `require` resolve against
          # the repo's installed deps and pass — masking exactly what this gates.
          iso="$(mktemp -d)"
          cp out/cli/houston-cli.cjs "$iso/"
          # --version must print the injected package version (not the "dev"
          # fallback), proving the build define landed and the bundle executes.
          ver="$(node -p "require('./package.json').version")"
          got="$(cd "$iso" && node houston-cli.cjs --version)"
          echo "houston-cli --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::CLI --version printed '$got', expected '$ver'"; exit 1; }
          # Exercise a real client path, not just --version: a `-p` run with an
          # isolated profile and no key must load the engine graph + host wiring and
          # exit non-zero with the friendly "No model configured" message — no
          # display server, no network.
          out="$(cd "$iso" && HOUSTON_DATA_DIR="$iso/profile" node houston-cli.cjs -p ping --cwd "$iso" 2>&1)" && code=0 || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::CLI -p with no key unexpectedly exited 0"; exit 1; }
          echo "$out" | grep -q "No model configured" || { echo "::error::CLI -p did not surface the expected 'No model configured' error"; exit 1; }
      - name: Smoke the CLI installer (bare `houston` on PATH)
        run: |
          set -euo pipefail
          # install-cli.mjs symlinks the built bundle into a bin dir as `houston`.
          # Point it at a scratch dir and confirm the resulting command runs — so
          # the "run it as a bare houston" path can't silently rot.
          bindir="$(mktemp -d)/bin"
          node scripts/install-cli.mjs --dir "$bindir"
          [ -L "$bindir/houston" ] || { echo "::error::installer did not create a houston symlink"; exit 1; }
          ver="$(node -p "require('./package.json').version")"
          got="$(PATH="$bindir:$PATH" houston --version)"
          echo "houston --version -> $got (expected $ver)"
          [ "$got" = "$ver" ] || { echo "::error::bare houston --version printed '$got', expected '$ver'"; exit 1; }

  # Exercise the Linux bubblewrap backend for REAL — the macOS-bound developer can't
  # run it locally, so CI is the source of truth. Installs bubblewrap, enables
  # unprivileged user namespaces (Ubuntu restricts them via AppArmor by default), and
  # hard-probes that confinement actually works before running the conformance suite —
  # a failed probe reds the job instead of letting the suite silently skip (false green).
  linux-sandbox:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          electron-cache: headers
      - name: Set up bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Newer Ubuntu (24.04) restricts unprivileged userns via AppArmor; relax it
          # for this ephemeral runner so the bubblewrap backend can actually confine.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          # Hard probe: the same namespace ops the real backend uses (including the
          # network namespace, where the userns restriction bites). Fail loudly if it
          # doesn't work rather than letting the conformance suite skip and report green.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /bin/bash -c ':'
      - run: npm ci
      # HOUSTON_REQUIRE_SANDBOX makes the conformance suite assert a real backend is
      # active, so even a subtle probe/selection mismatch fails the job.
      - run: HOUSTON_REQUIRE_SANDBOX=1 npx vitest run src/main/sandbox/conformance.test.ts

  # Which `package` legs this run needs, and whether a push must refresh the package caches.
  # The policy and its reasons live in scripts/ci-plan.mjs (unit-tested); this job only
  # feeds it the event, the PR's labels, and the files the run changes. It cannot skip a
  # required check: `test`, `linux-sandbox` and `revert-guard` never read it, and `build`
  # fails unless this job succeeded and `package` did exactly what it planned.
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.plan.outputs.package }}
      package-matrix: ${{ steps.plan.outputs.package-matrix }}
      action-e2e: ${{ steps.plan.outputs.action-e2e }}
      warm-caches: ${{ steps.plan.outputs.warm-caches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          # A PR's HEAD is refs/pull/N/merge, so HEAD^1 is its base and the diff is the PR.
          fetch-depth: 2
      # Against what lands: a PR's merge into its base, a queue candidate against the main it
      # was built on (so the PRs ahead of it count too), a push against main before it. Any
      # failure leaves the list out, and the plan then assumes everything changed.
      - name: List the files this run changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$QUEUE_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) exit 0 ;;
          esac
          if [ "$EVENT" != pull_request ]; then
            git fetch --no-tags --depth=1 origin "$base" || exit 0
          fi
          files="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$base" HEAD > "$files" || exit 0
          echo "changed files: $(wc -l < "$files")"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          FILES_FROM: ${{ steps.diff.outputs.files }}
        run: node scripts/ci-plan.mjs >> "$GITHUB_OUTPUT"

  # Package the app on the platforms it ships on, each on its own runner (cross-compilation
  # is impossible: native node-pty + per-(os,arch) rg/ast-grep binaries), and run the
  # platform-specific suites there:
  #   - Every non-Linux leg runs the full unit suite (Linux runs it in `test`): macOS against
  #     the real Seatbelt sandbox backend, Windows against its own backend (Git Bash) and its
  #     path and permission semantics.
  #   - Every leg runs the packaged-app e2e (Playwright driving the app it just built), the
  #     only check that the asar archive, the afterPack vendored binaries, and the
  #     main/preload/renderer bridge work together in the real artifact.
  # Which legs run is `plan`'s call: Linux on a PR (all four with the `full-ci` label),
  # Linux + macOS arm64 + Windows on a queue candidate, all four nightly, none for a
  # prose-only change. The legs themselves (runner labels, dist scripts) are LEGS in
  # scripts/ci-plan.mjs, the same matrix as release-prepare.yml / release-publish.yml.
  package:
    name: package (${{ matrix.target }})
    needs: plan
    timeout-minutes: 45
    # Not on push:[main]. The merge-queue candidate already ran this on the exact tree
    # that landed, so a second macOS/Windows pass after the merge would only repeat it.
    if: github.event_name != 'push' && !inputs.release && needs.plan.outputs.package == 'true'
    # Windows defaults `run:` steps to PowerShell; force bash for the whole matrix so a
    # bash step can't silently behave differently on the Windows leg.
    defaults:
      run:
        shell: bash
    env:
      # Validates packaging, not distribution: never sign or notarize here. No signing
      # secrets are in scope, and this stops electron-builder probing the keychain, so a
      # runner that happens to carry a signing identity can't change the output. Real
      # signing happens only in release-publish.yml.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          install: full
          electron-cache: full
      # Windows: the suite's temp dirs (os.tmpdir()) default to %TEMP% under the user profile
      # on C:, the OS disk, which is slower than D: and has stalled for seconds at a time,
      # timing out tests that do temp-dir I/O. $RUNNER_TEMP is on D: beside the workspace
      # (outside it, so git never sees a parent repo) and is emptied per job.
      - if: runner.os != 'Linux'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Upload test results
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.target }}
          retention-days: 7
          path: reports/junit.xml
          if-no-files-found: ignore
      # `--publish never` (passed by scripts/dist-with-retry.sh) is load-bearing on
      # merge_group. Without an explicit policy, electron-builder publishes implicitly
      # whenever it detects CI and the run is not a PR, and it recognises a PR only by
      # GITHUB_BASE_REF, which a merge-queue candidate does not set. It then tries to create
      # a GitHub release, fails for want of GH_TOKEN (ci.yml holds no credential, by
      # design), and every queue entry is ejected.
      #
      # On macOS the script also retries electron-builder's dmg detach flake ("Unable to
      # detach device cleanly ... Resource busy"), which used to eject good PRs from the
      # merge queue. Any other failure fails at once.
      - name: Package
        env:
          DIST: ${{ matrix.dist }}
        run: bash scripts/dist-with-retry.sh "$DIST"
      # Linux has no display on the runner, so the e2e runs under Xvfb. bubblewrap lets the
      # agent-turn test's shell command run in the real Linux sandbox backend rather than
      # unconfined. (This leg is ubuntu-22.04, which doesn't restrict unprivileged user
      # namespaces, so unlike linux-sandbox it needs no AppArmor change.)
      - name: Set up a display and bubblewrap for the e2e
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb bubblewrap
      # The app was just packaged above, so run the suite against it without rebuilding.
      - name: Packaged-app e2e
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:e2e:packaged
          else
            npm run test:e2e:packaged
          fi
      # Playwright's error context and traces, so a red e2e can be diagnosed from the run.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.target }}
          retention-days: 7
          path: test-results/
          if-no-files-found: ignore
      # Inspection-only build of this PR (never a published feed: the updater reads
      # Releases). Lets a reviewer install the PR's app without building it locally.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: houston-${{ matrix.target }}
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  # Refresh the package legs' dependency caches from main. A cache saved by a PR or a
  # merge-queue run is scoped to that ref and no other PR can restore it, and `package`
  # doesn't run on push. So without this, every new PR started these legs cold: a full npm
  # download, the Electron runtime and headers, and electron-builder's tools, about 3
  # minutes of npm ci alone on Windows. A main-scoped entry is readable by every PR. It
  # packages too, because electron-builder fetches its tools (NSIS, dmg-builder) only while
  # packaging, and a cache is saved only on a miss.
  # Linux is included: `test` runs on push too, but it only installs, so it caches the
  # npm downloads and Electron headers, not what packaging needs.
  #
  # Only on a push that changes what the caches hold (`plan`: the lockfile they are keyed
  # on, .nvmrc, the setup action, electron-builder.yml). Any other merge hits the existing
  # entries, saves nothing, and would only hold a macOS runner the queue needs. The nightly
  # run's package legs save on a miss too, which covers the Intel leg left out here.
  warm-caches:
    name: warm-caches (${{ matrix.target }})
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.warm-caches == 'true'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            dist: dist:linux
          - target: mac-arm64
            os: macos-15
            dist: dist:mac
          - target: win-x64
            os: windows-2025
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          install: full
          electron-cache: full
      - name: Package (fills the electron-builder tool cache)
        env:
          DIST: ${{ matrix.dist }}
        run: npm run "$DIST" -- --publish never

  # SBOM conformance (NTIA / CISA FSCT3 / CycloneDX / Google-EO) on every PR, so a
  # dependency change that drops the shipped SBOMs below the bar fails the PR that made it
  # rather than the next release.
  sbom-conformance:
    if: github.event_name != 'push' && !inputs.release
    uses: ./.github/workflows/sbom-conformance.yml

  # The GitHub Action's end-to-end test, when `plan` says the change can affect the action
  # (action/, the signing key, or the test workflow) and nightly. Gated through `build`.
  action-e2e:
    needs: plan
    if: needs.plan.outputs.action-e2e == 'true'
    uses: ./.github/workflows/action-test.yml
    with:
      ref: ${{ inputs.ref }}

  # Lints the workflows themselves: actionlint (syntax, expressions, and shellcheck over every
  # `run:` script) and zizmor (Actions security: template injection, credential persistence,
  # over-broad permissions, impostor or known-vulnerable action commits). Both are pinned and
  # hash-verified. Gated through `build`, so it is required without a ruleset change.
  workflow-lint:
    if: github.event_name != 'push'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install zizmor
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes \
            --only-binary :all: -r .github/workflow-lint/requirements.txt
      - name: actionlint
        run: actionlint -color
      # The GitHub Action's example workflows live outside .github/workflows, so they are
      # named explicitly (each tool only finds workflows there on its own).
      - name: actionlint (action examples)
        run: actionlint -color action/examples/*.yml
      # Online mode (a token) adds the impostor-commit and known-vulnerable-actions audits,
      # which check every pinned SHA against its upstream repository.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github --min-severity low --config .github/zizmor.yml .github/workflows .github/actions action action/examples/*.yml

  # The required `build` check: one stable name over the whole platform matrix, the action
  # test, the SBOM gate, and workflow-lint, so adding or renaming a matrix leg never needs a
  # ruleset change.
  #
  # `!cancelled()` is load-bearing. A job whose dependency failed is SKIPPED by default, and
  # a skipped required check reports a PASS, so without it a red macOS leg would let the PR
  # merge. Here the job runs whenever the run itself was not cancelled, and fails unless
  # every dependency actually succeeded (a skipped or cancelled dependency fails it too).
  # The one allowed skip is `package` when `plan` succeeded and planned no legs (a
  # prose-only change); a `package` skipped for any other reason, or a failed `plan`, fails.
  # It is not `always()`: when the concurrency group cancels a superseded run (Dependabot
  # opens and labels a PR in the same second), `always()` ran this job anyway and posted a
  # red `build` that kept the PR blocked after the newer run went green.
  build:
    needs: [plan, package, sbom-conformance, workflow-lint, action-e2e]
    if: ${{ !cancelled() && github.event_name != 'push' && !inputs.release }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Require the planned platform legs and action test, the SBOM gate, and workflow-lint to pass
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGE_PLANNED: ${{ needs.plan.outputs.package }}
          PACKAGE: ${{ needs.package.result }}
          SBOM: ${{ needs.sbom-conformance.result }}
          LINT: ${{ needs.workflow-lint.result }}
          ACTION_E2E_PLANNED: ${{ needs.plan.outputs.action-e2e }}
          ACTION_E2E: ${{ needs.action-e2e.result }}
        run: |
          echo "plan=$PLAN (package planned: $PACKAGE_PLANNED, action-e2e planned: $ACTION_E2E_PLANNED) package=$PACKAGE action-e2e=$ACTION_E2E sbom-conformance=$SBOM workflow-lint=$LINT"
          for r in "$PLAN" "$SBOM" "$LINT"; do
            [ "$r" = success ] || { echo "::error::plan, the SBOM gate, or workflow-lint did not succeed ($r)"; exit 1; }
          done
          if [ "$PACKAGE_PLANNED" = false ]; then
            [ "$PACKAGE" = skipped ] || { echo "::error::no package legs were planned, but package reported $PACKAGE"; exit 1; }
            echo "No package legs planned: the change touches only prose that never ships."
          else
            [ "$PACKAGE" = success ] || { echo "::error::a package leg did not succeed ($PACKAGE)"; exit 1; }
          fi
          if [ "$ACTION_E2E_PLANNED" = true ]; then
            [ "$ACTION_E2E" = success ] || { echo "::error::the action's end-to-end test did not succeed ($ACTION_E2E)"; exit 1; }
          else
            [ "$ACTION_E2E" = skipped ] || { echo "::error::the action's end-to-end test was not planned, but reported $ACTION_E2E"; exit 1; }
          fi

  # Post-merge and nightly alert. Queue merges are pushed by github-merge-queue[bot] and a
  # scheduled run's actor is whoever last touched this file, so GitHub's own failure
  # notification reaches no one reliably and a broken main would stay silent. Files (or
  # closes) one issue per kind of run through the same reusable alert the scheduled
  # workflows use. `build` is skipped on push and carries the package legs nightly.
  alert:
    needs: [test, linux-sandbox, build]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule')
      && !cancelled() && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      issues: write
    with:
      workflow: ${{ github.event_name == 'schedule' && 'CI nightly' || 'CI on main' }}
      failed: ${{ contains(needs.*.result, 'failure') }}

  # Silent-clobber guard. A PR branched off an out-of-date main can, when merged,
  # delete files and revert code that landed while it was open — and CI does not
  # notice, because the reverted features' tests are removed in the same commit. That
  # happened once: #551 reverted three merged PRs (~3,200 lines, 8 files) and main
  # stayed green. See AGENTS.md > "Avoiding silent-clobber merges".
  #
  # `actions/checkout` on a pull_request event checks out `refs/pull/N/merge`, which is
  # this PR already merged into main — so HEAD here IS the landing tree, and the guard
  # sees exactly what merging would produce against main as of this run. Main can move
  # before the queue lands the PR, but that cannot open a hole: the queue lands a real
  # three-way merge, which carries only this PR's own changes, so nothing merged after
  # this run can be reverted by it. Everything already on main, this run did see.
  #
  # A deliberate removal (dead code, a real revert) is acknowledged with the
  # `intentional-revert` label, which sets ALLOW_REVERT=1 and puts the intent on record.
  revert-guard:
    timeout-minutes: 5
    # Only meaningful on a PR: on push:[main] the merge has already happened.
    #
    # Deliberately NOT run on merge_group either, even though a queue candidate is a
    # landing tree. The `intentional-revert` override is read from the PR's labels, which
    # a merge_group event does not carry, so a legitimate revert would hit a guard it has
    # no way to acknowledge and wedge the queue. Running it on the PR loses nothing:
    # `refs/pull/N/merge` is this PR merged into its base, so the guard sees the real
    # before/after regardless of how stale the branch is.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The guard scans main's recent commits to decide whether a removal collides
          # with work that landed while this branch was open, so it needs real history,
          # not the default depth-1 checkout.
          fetch-depth: 0
      # Against the tree the merge was built on: the merge commit's first parent. That is
      # the PR's own base (main, or a release line for a backport or release PR) as GitHub
      # saw it when it built refs/pull/N/merge, or, for a PR in a stack, the PRs below it
      # merged onto main. Re-fetching the base branch instead races both: anything that
      # lands on main between building the merge ref and this step looks like content the
      # PR removes, and a stacked PR's merge ref sits on a snapshot of main that only moves
      # when the stack is pushed.
      - name: Check this merge does not revert work already on its base branch
        env:
          ALLOW_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'intentional-revert') && '1' || '' }}
          # A Dependabot update that prunes packages shrinks package-lock.json and
          # THIRD-PARTY-NOTICES.md, which reads as a revert; this exempts only those two
          # files from the recent-content rule (see GENERATED_DEPENDENCY_FILES).
          DEPENDENCY_UPDATE: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '' }}
        run: node scripts/merge-revert-guard.mjs HEAD^1 HEAD

  # Release PRs (release-pr/vX.Y.Z, opened by release-prepare.yml): the notes' one-sentence
  # summary must pass, and the PR may change nothing but the version and CHANGELOG. Release
  # - publish refuses either problem too; this shows it on the PR, while it can still be
  # fixed by editing the notes, instead of after the merge.
  release-notes:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-pr/v')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merged into its base; HEAD^1 is the base, so the diff is the PR.
          fetch-depth: 2
      - uses: ./.github/actions/setup-node
        with:
          cache: 'false'
      - name: Check the release notes and what the release PR changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release-pr/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$HEAD_REF is not a release-pr/vX.Y.Z branch."
            exit 1
          fi
          extra=$(git diff --name-only HEAD^1 HEAD | grep -v -x -E 'CHANGELOG\.md|package\.json|package-lock\.json' || true)
          if [ -n "$extra" ]; then
            echo "::error::A release PR may change only the version and CHANGELOG.md, but it changes: $extra"
            exit 1
          fi
          node scripts/check-changelog-summary.mjs "$version"
