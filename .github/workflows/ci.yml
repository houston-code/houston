name: CI

on:
  # `labeled` is included so adding the `auto-merge` label triggers a run that
  # sees it: when a PR is opened and labeled near-simultaneously, the `opened`
  # event payload can miss the label and the label-gated jobs skip. (opened,
  # synchronize, reopened are the defaults, restated here since `types` replaces them.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The e2e suite drives Electron via Playwright's `_electron` launcher, never a
  # bundled browser, so skip the large browser download `@playwright/test`'s
  # postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    # Run the suite on Linux AND macOS. The sandbox conformance suite
    # (src/main/sandbox/conformance.test.ts) exercises the real OS sandbox where one
    # exists: the macOS leg verifies the Seatbelt backend end-to-end. This ubuntu leg
    # has no bubblewrap installed, so it uses the unconfined backend and the
    # confinement-only assertions skip — the real bubblewrap exercise is the dedicated
    # `linux-sandbox` job below. macos-14 is arm64, matching the build target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Exercise the Linux bubblewrap backend for REAL — the macOS-bound developer can't
  # run it locally, so CI is the source of truth. Installs bubblewrap, enables
  # unprivileged user namespaces (Ubuntu restricts them via AppArmor by default), and
  # hard-probes that confinement actually works before running the conformance suite —
  # a failed probe reds the job instead of letting the suite silently skip (false green).
  linux-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Set up bubblewrap + unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Newer Ubuntu (24.04) restricts unprivileged userns via AppArmor; relax it
          # for this ephemeral runner so the bubblewrap backend can actually confine.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          # Hard probe: the same namespace ops the real backend uses (including the
          # network namespace, where the userns restriction bites). Fail loudly if it
          # doesn't work rather than letting the conformance suite skip and report green.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /bin/bash -c ':'
      - run: npm ci
      # HOUSTON_REQUIRE_SANDBOX makes the conformance suite assert a real backend is
      # active, so even a subtle probe/selection mismatch fails the job.
      - run: HOUSTON_REQUIRE_SANDBOX=1 npx vitest run src/main/sandbox/conformance.test.ts

  # TEMPORARILY DISABLED — the macOS packaging job is commented out for now.
  # Re-enable once we're ready to ship signed/notarized builds again (tracked in TODO.md).
  # Nothing depends on `build-mac`, so disabling it leaves `test` and `auto-merge` intact.
  #
  # # Package the macOS app (.app + .dmg) for every PR that's set to auto-merge.
  # # We can't build on push-to-main: the auto-merge job merges with GITHUB_TOKEN,
  # # and GitHub won't trigger a new workflow run from a GITHUB_TOKEN push. Instead
  # # we build on the pull_request event, which checks out the merge ref (main + PR)
  # # — i.e. exactly the state that's about to land. electron-builder --mac only
  # # runs on macOS; macos-14 is arm64, matching the build target.
  # build-mac:
  #   needs: test
  #   if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge')
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  #     - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
  #       with:
  #         node-version-file: '.nvmrc'
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run dist
  #     # Smoke-test the packaged app we just built: the spec launches
  #     # release/mac-arm64/Houston.app via Playwright and asserts the renderer
  #     # mounts — exercising the asar archive, bundled resources, and the
  #     # main ↔ preload ↔ renderer IPC bridge end to end. macOS (the build target)
  #     # has a display without xvfb. `test:e2e` rebuilds out/ first (cheap); the
  #     # spec prefers the packaged app already present in release/.
  #     - run: npm run test:e2e
  #     - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  #       with:
  #         name: houston-mac-arm64
  #         path: |
  #           release/*.dmg
  #           release/mac*/Houston.app
  #         if-no-files-found: error

  auto-merge:
    needs: [test, linux-sandbox]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    # A PR opened *and* labeled at once can spawn two CI runs for the same PR (see
    # the `on:` comment). Without this, both runs' auto-merge jobs fire `gh pr merge`
    # at once and the loser dies with "merge already in progress", reddening a PR that
    # merged fine. Serialize auto-merge per-PR so the second job waits for the first
    # instead of racing it. cancel-in-progress is false on purpose: cancelling could
    # tear down a mid-merge job, and we never want to lose the run carrying the label.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Idempotent merge. `gh pr merge` exits non-zero for several reasons; only a
      # genuinely un-merged PR should fail the job. After a non-zero exit we confirm
      # the PR's state (polling briefly, since a concurrent run's merge may still be
      # committing) and exit 0 if it's MERGED — otherwise stay red so real failures
      # (conflicts, failing required checks) surface. `|| state=UNKNOWN` keeps a flaky
      # `gh pr view` from aborting the step under `set -eo pipefail`.
      - run: |
          if gh pr merge "$PR" --merge --delete-branch; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$PR" --json state --jq .state) || state=UNKNOWN
            if [ "$state" = "MERGED" ]; then
              echo "::warning::PR #$PR is MERGED but 'gh pr merge' exited non-zero (a concurrent run merged it, or --delete-branch failed). Verify the head branch was removed."
              exit 0
            fi
            echo "Attempt $attempt: PR #$PR state=$state (not yet MERGED); waiting for any in-flight merge."
            sleep 3
          done
          echo "::error::Merge failed and PR #$PR is not merged (state=$state)."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
