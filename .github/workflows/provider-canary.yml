name: Provider canary

# Nightly live-API canary for the provider integrations.
#
# The offline unit suite MOCKS the provider SDKs, so by construction it cannot catch a provider
# removing or renaming a request parameter on a live model — the mocks keep answering the old
# shape. That is exactly what bit us when Opus 4.7/4.8 changed the accepted thinking/output_config
# shape and began returning 400 while every mocked test still passed. The
# src/main/providers/*.integration.test.ts suites were written for precisely that class of drift
# (they make one tiny real reasoning call per shipped model), but they self-skip without an API
# key, so nothing ever ran them. This wires the ANTHROPIC_API_KEY secret — already used by
# release-prepare.yml for changelog drafting — into a scheduled run so provider drift fails loudly
# within a day instead of first surfacing when a user hits it.
#
# THIS WORKFLOW NEVER PUBLISHES ANYTHING: `permissions: contents: read`, no build/dist/release
# step, and the only secret in scope is the Anthropic key (step-scoped, never at job level). It is
# deliberately a SEPARATE file from nightly-build.yml, which guarantees "no publish credential in
# scope" for the packaging matrix — putting a live API key in that job would erode that posture.
#
# OPENAI GAP (there is intentionally no OpenAI leg here yet):
#   1. There is no OPENAI_API_KEY repo secret, so there is no credential to drive a hosted-OpenAI
#      canary with in the first place.
#   2. Even given one, src/main/providers/openai.integration.test.ts targets a *local*
#      OpenAI-compatible server (HOUSTON_TEST_OPENAI_BASE) rather than the hosted OpenAI API, so it
#      is not a hosted-provider-drift canary at all.
#   Closing the gap needs BOTH an OPENAI_API_KEY secret AND a hosted-OpenAI canary test; then add a
#   second job here mirroring the `anthropic` one below.

on:
  schedule:
    # 08:00 UTC daily — one hour after nightly-build.yml (07:00) so the two nightlies don't start
    # together. Cron has no timezone; this is a fixed UTC wall-clock time.
    - cron: '0 8 * * *'
  # Allow an on-demand run (e.g. right after a provider announces a model or param change) without
  # waiting for the nightly slot.
  workflow_dispatch: {}

permissions:
  contents: read

# Don't stack a manual run on top of a scheduled one (or two scheduled fires) — keep the latest.
concurrency:
  group: provider-canary
  cancel-in-progress: true

env:
  # No Electron runtime and no packaged browser are exercised here; skip the large browser download
  # @playwright/test's postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  anthropic:
    # One tiny reasoning call per shipped Claude model plus install; 15 min mirrors ci.yml's `test`
    # job and leaves generous headroom over the test's own 60s-per-model cap.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Fail LOUDLY instead of silently skipping. The canary is `describe.skipIf(!API_KEY)`, so a
      # missing or empty secret would make it SKIP and the job go GREEN — a false green that hides
      # exactly the drift this workflow exists to catch. Assert the key is present up front so a
      # misconfigured secret reds the job instead.
      - name: Require the Anthropic API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty/unset — the live provider canary would silently skip (false green). Set the repo secret."
            exit 1
          fi
      # Live call against the real Anthropic API: for every shipped Claude model it sends the exact
      # thinking/output_config shape Houston builds and fails on a 400 (a removed/renamed param) or
      # any stream error. The file self-skips without the key, but the guard step above already
      # ensured it's set, so a skip here would itself be a bug.
      - name: Anthropic live-API canary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx vitest run --project node src/main/providers/anthropic.integration.test.ts
