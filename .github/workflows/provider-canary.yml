name: Provider canary

# Nightly live-API canary for the provider integrations.
#
# The offline unit suite MOCKS the provider SDKs, so by construction it cannot catch a provider
# removing or renaming a request parameter on a live model — the mocks keep answering the old
# shape. That is exactly what bit us when Opus 4.7/4.8 changed the accepted thinking/output_config
# shape and began returning 400 while every mocked test still passed. The
# src/main/providers/*.integration.test.ts canaries were written for precisely that class of drift
# (one tiny real reasoning call per shipped model), but they self-skip without an API key, so
# nothing ever ran them. This runs them on a schedule so provider drift fails loudly within a day
# instead of first surfacing when a user hits it.
#
# One leg per hosted (key-requiring) provider Houston ships. They are deliberately SEPARATE JOBS
# with no `needs` between them: each must be able to red on its own, so one provider's drift never
# masks (or blocks the reporting of) another's, and a single provider outage doesn't hide a real
# break.
#
#   anthropic -> anthropic.integration.test.ts, keyed on ANTHROPIC_API_KEY
#   openai    -> responses.integration.test.ts, keyed on OPENAI_API_KEY
#   gemini    -> gemini.integration.test.ts,    keyed on GEMINI_API_KEY
#
# That covers every provider with a hosted API to drift against. The remaining built-ins (ollama,
# lmstudio) are `kind: openai-compatible` with `requiresKey: false` and a localhost baseUrl — a
# local server the user pins can't change out from under us overnight, which is the whole premise
# of a drift canary, and openai.integration.test.ts already covers that adapter against a local
# server. A user-configured gateway (e.g. an openai-compatible proxy) isn't shipped in defaults, so
# there's no request shape of ours to canary there either.
#
# NOTE on the OpenAI leg: it covers `responses.ts`, NOT `openai.ts`. The built-in OpenAI provider
# ships without a custom base URL, and src/main/providers/index.ts routes exactly that case to
# `createResponsesProvider` — so the Responses API is the path real users on the built-in provider
# hit. openai.integration.test.ts drives `createOpenAIProvider` (Chat Completions) against a
# *local* OpenAI-compatible server, which is the proxy/gateway path; it needs a running local
# server (HOUSTON_TEST_OPENAI_BASE), never touches the hosted API, and so is NOT a hosted-drift
# canary and is intentionally not run here.
#
# THIS WORKFLOW NEVER PUBLISHES ANYTHING: `permissions: contents: read`, no build/dist/release
# step, and each provider key is scoped to only the steps that need it (never at job or workflow
# level). It is deliberately a SEPARATE file from ci.yml, whose packaging matrix guarantees "no
# credential in scope". Putting live API keys in that job would erode that posture.

on:
  schedule:
    # 08:00 UTC daily. Cron has no timezone; this is a fixed UTC wall-clock time.
    - cron: '0 8 * * *'
  # Allow an on-demand run (e.g. right after a provider announces a model or param change) without
  # waiting for the nightly slot.
  workflow_dispatch: {}

permissions:
  contents: read

# Don't stack a manual run on top of a scheduled one (or two scheduled fires) — keep the latest.
concurrency:
  group: provider-canary
  cancel-in-progress: true

env:
  # No Electron runtime and no packaged browser are exercised here; skip the large browser download
  # @playwright/test's postinstall would otherwise run during `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  canary:
    name: canary (${{ matrix.provider }})
    # One tiny reasoning call per shipped model plus install; 15 min mirrors ci.yml's `test` job.
    # Each model is two 30s-capped attempts at most (src/main/providers/canary.ts), so even a
    # provider-wide stall reds in ~1 min per model, well inside this.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      # Independent on purpose, so any provider can red without the others masking it.
      fail-fast: false
      matrix:
        include:
          # Anthropic: for every shipped Claude model, the exact thinking/output_config shape
          # Houston builds; fails on a 400 (a removed/renamed param) or any stream error.
          - provider: anthropic
            key: ANTHROPIC_API_KEY
            test: src/main/providers/anthropic.integration.test.ts
          # OpenAI Responses API: for every shipped GPT-5/o-series model, the exact
          # `reasoning: { effort, summary }` shape; fails on a 400, a 404 (a default model that
          # is no longer served), or any stream error.
          - provider: openai
            key: OPENAI_API_KEY
            test: src/main/providers/responses.integration.test.ts
          # Gemini: the exact `thinkingConfig` shape on the 2.5 models (and deliberately none on
          # 2.0-flash). gemini.ts throws rather than yielding an error event, so a rejected
          # parameter surfaces as a thrown stream error.
          - provider: gemini
            key: GEMINI_API_KEY
            test: src/main/providers/gemini.integration.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fail LOUDLY instead of silently skipping, and before spending the install on it. Each
      # canary is `describe.skipIf(!API_KEY)`, so a missing or empty secret would make it SKIP
      # and the job go GREEN: a false green that hides exactly the drift this workflow exists to
      # catch. The key is selected by literal name (no dynamic `secrets[...]` index), so each leg
      # can only ever see its own secret.
      - name: Require the API key
        env:
          KEY_NAME: ${{ matrix.key }}
          API_KEY: >-
            ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY
            || matrix.provider == 'openai' && secrets.OPENAI_API_KEY
            || matrix.provider == 'gemini' && secrets.GEMINI_API_KEY
            || '' }}
        run: |
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::${KEY_NAME} is empty or unset, so the live provider canary would silently skip (false green). Set the repo secret."
            exit 1
          fi
      - uses: ./.github/actions/setup-node
        with:
          install: full
      - name: Live-API canary
        env:
          KEY_NAME: ${{ matrix.key }}
          TEST_FILE: ${{ matrix.test }}
          API_KEY: >-
            ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY
            || matrix.provider == 'openai' && secrets.OPENAI_API_KEY
            || matrix.provider == 'gemini' && secrets.GEMINI_API_KEY
            || '' }}
        run: |
          set -euo pipefail
          export "${KEY_NAME}=${API_KEY}"
          unset API_KEY
          npx vitest run --project node "$TEST_FILE"

  # Tell a human when the canary breaks — GitHub's own failure notification for a scheduled
  # run goes to github-actions[bot]. A provider retiring a param is exactly the drift this
  # canary exists to catch, so a silent red one defeats the point. Scheduled runs only; a
  # hand-dispatched run already notifies whoever started it. See alert-on-failure.yml.
  alert:
    # A failed matrix leg fails the `canary` job as a whole, so a new provider added to the
    # matrix above is covered here without listing it.
    needs: [canary]
    if: >-
      always() && github.event_name == 'schedule'
      && !cancelled() && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/alert-on-failure.yml
    permissions:
      issues: write
    with:
      workflow: Provider canary
      failed: ${{ contains(needs.*.result, 'failure') }}
