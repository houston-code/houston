name: Set up Node and install dependencies
description: >-
  Node from .nvmrc, an optional npm download cache, and one of the repo's npm ci variants.
  Every workflow uses this so the Node source, cache policy and install flags change in one
  place. Run actions/checkout first.

inputs:
  install:
    description: >-
      full (npm ci, lifecycle scripts run), no-scripts (npm ci --ignore-scripts), production
      (npm ci --omit=dev --ignore-scripts), or none.
    default: none
  cache:
    description: Restore and save the ~/.npm download cache, keyed on package-lock.json.
    default: 'true'
  electron-cache:
    description: >-
      Also cache the Electron runtime, the Electron headers node-gyp needs to rebuild node-pty,
      and electron-builder's tool downloads. CI only: release builds start from a clean download.
    default: 'false'

runs:
  using: composite
  steps:
    # Before npm ci, whose postinstall downloads Electron and (via electron-rebuild) its
    # headers: a download that times out fails the whole install, so a warm cache keeps a
    # flaky CDN from turning a job red. Paths for all three OSes; missing ones are ignored.
    - if: inputs.electron-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/.electron-gyp
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
    - name: npm ci (${{ inputs.install }})
      if: inputs.install != 'none'
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        case "$INSTALL" in
          full) npm ci ;;
          no-scripts) npm ci --ignore-scripts ;;
          production) npm ci --omit=dev --ignore-scripts ;;
          *) echo "::error::unknown install mode '$INSTALL' (expected full, no-scripts, production or none)"; exit 1 ;;
        esac
