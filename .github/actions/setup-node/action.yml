name: Set up Node and install dependencies
description: >-
  Node from .nvmrc, an optional npm download cache, and one of the repo's npm ci variants.
  Every workflow uses this so the Node source, cache policy and install flags change in one
  place. Run actions/checkout first.

inputs:
  install:
    description: >-
      full (npm ci, lifecycle scripts run), no-scripts (npm ci --ignore-scripts), production
      (npm ci --omit=dev --ignore-scripts), or none.
    default: none
  cache:
    description: Restore and save the ~/.npm download cache, keyed on package-lock.json.
    default: 'true'
  electron-cache:
    description: >-
      CI only (release builds start from a clean download). `headers` caches the Electron
      headers node-gyp needs to rebuild node-pty during npm ci, which is all an install-only
      job uses. `full` also caches the Electron runtime and electron-builder's tools that
      packaging downloads. They are separate keys: an install-only job saves no Electron
      runtime, and sharing one key let it save a near-empty entry that a packaging job then
      hit and never replaced.
    default: 'false'

runs:
  using: composite
  steps:
    - if: ${{ !contains(fromJSON('["false", "headers", "full"]'), inputs.electron-cache) }}
      shell: bash
      env:
        MODE: ${{ inputs.electron-cache }}
      run: |
        echo "::error::unknown electron-cache '$MODE' (expected false, headers or full)"
        exit 1
    # Before npm ci, whose postinstall rebuilds node-pty against the Electron headers: a
    # download that times out fails the whole install, so a warm cache keeps a flaky CDN
    # from turning a job red.
    - if: inputs.electron-cache == 'headers'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.electron-gyp
        key: electron-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-headers-${{ runner.os }}-${{ runner.arch }}-
    # Packaging downloads the Electron runtime and electron-builder's tools (NSIS,
    # dmg-builder, AppImage) into their per-OS default cache dirs; missing ones are ignored.
    - if: inputs.electron-cache == 'full'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/.electron-gyp
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-full-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-full-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
    - name: npm ci (${{ inputs.install }})
      if: inputs.install != 'none'
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        case "$INSTALL" in
          full) npm ci ;;
          no-scripts) npm ci --ignore-scripts ;;
          production) npm ci --omit=dev --ignore-scripts ;;
          *) echo "::error::unknown install mode '$INSTALL' (expected full, no-scripts, production or none)"; exit 1 ;;
        esac
