version: 2
updates:
  # Keep npm dependencies current (security + features). Grouped to limit PR noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week after a version is published before proposing it. Patch and minor PRs
    # are queued for merge automatically (dependabot-auto-queue.yml), and a hijacked
    # maintainer account's malicious release is usually caught and yanked within days;
    # without a cooldown it could merge, and later run its install scripts in the release
    # job that holds the signing keys, before anyone noticed. Security updates are not
    # subject to the cooldown, so a published fix still arrives immediately.
    cooldown:
      default-days: 7
    # No labels requested. Dependabot labels its PRs right after opening them anyway (PR #580
    # still got `dependencies` and `javascript` with this set), and CI runs on `labeled` (for
    # `full-ci` and `intentional-revert`), so each label starts another CI run in the same
    # second as the `opened` one. When the run the concurrency group cancels is the newest
    # one, the PR's required checks read "expected" forever (PRs #558, #577). ci-heal.yml
    # re-runs that cancelled run; this setting only keeps the label noise down where it works.
    # Nothing reads these labels; Dependabot PRs are found by author.
    labels: []
    # Patch and minor updates only in the groups. dependabot-auto-queue.yml queues patch and
    # minor PRs and leaves majors for review, and a group PR's update type is its largest
    # bump, so one major in a group (PR #576: the Anthropic SDKs going 0.x to 1.x) held back
    # every minor beside it. Majors now arrive as their own PRs.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x peers on `typescript >=4.8.4 <6.1.0`, so it cannot
      # resolve the native TypeScript 7 compiler — grouping TS 7 in dev-deps makes
      # `npm ci` fail on the peer conflict. Pin to TypeScript 6 until typescript-eslint
      # ships TS 7 support, then remove.
      - dependency-name: typescript
        versions: ['>=7']
      # mermaid 12 adds elkjs, which is EPL-2.0 and not on the license-gate allowlist.
      # Stay on mermaid 11 until that license is reviewed or mermaid drops elkjs.
      # When lifting this: reopen Dependabot alert #63 (katex GHSA-238p-pmpm-9mq7), which
      # was dismissed because mermaid 11 caps katex at ^0.16; it needs katex >=0.18.2.
      - dependency-name: mermaid
        versions: ['>=12']
  # Keep GitHub Actions pinned-SHAs up to date.
  - package-ecosystem: github-actions
    # The workflows, plus the composite actions under .github/actions/, which pin their own
    # action SHAs.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Same reasoning as npm above: a retagged or compromised action release gets a week
    # to be caught before it is proposed.
    cooldown:
      default-days: 7
    # No labels requested, for the same duplicate-CI-run reason as npm above.
    labels: []
