version: 2
updates:
  # Keep npm dependencies current (security + features). Grouped to limit PR noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # vite 8 requires electron-vite 6, which is still beta — holding the whole
      # dev-deps group's install hostage. Pin to vite 7 (and its compatible
      # @vitejs/plugin-react 5) until electron-vite 6 ships stable, then remove.
      - dependency-name: vite
        versions: ['>=8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6']
  # Keep GitHub Actions pinned-SHAs up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
