appId: com.houston.app
productName: Houston
copyright: Copyright © 2026 Houston contributors

# Update feed for electron-updater. electron-builder generates the update
# metadata (latest-mac.yml) alongside the DMG; publishing a GitHub Release with
# those assets is what lets packaged apps auto-update from it.
publish:
  provider: github
  owner: piyushvijay
  repo: houston

directories:
  buildResources: build
  output: release

# out/ holds the bundled main/preload/renderer. electron-builder additionally
# bundles production dependencies from package.json automatically.
files:
  - out/**/*
  - package.json

# Vendor CLI binaries into the app's Resources so search works fast out of the
# box, independent of the user's PATH. `@vscode/ripgrep` is a build-time-only
# (dev) dependency whose platform sub-package ships the prebuilt binary; we copy
# just the arm64 binary (the only build target) to Resources/bin, where the main
# process resolves it via `process.resourcesPath` (see src/main/binaries.ts).
extraResources:
  - from: node_modules/@vscode/ripgrep-darwin-arm64/bin/rg
    to: bin/rg

# No native modules — skip the rebuild step. (The vendored binaries above are
# standalone executables, not node addons, so there's nothing to rebuild.)
npmRebuild: false
asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
  # No Apple Developer ID on this machine — build an ad-hoc (unsigned) app.
  # To notarize later, set identity to your Developer ID and configure notarize.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
