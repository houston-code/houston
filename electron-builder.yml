appId: com.houston.app
productName: Houston
copyright: Copyright © 2026 Houston developers

# Update feed for electron-updater. electron-builder generates the update
# metadata (latest-mac.yml) alongside the DMG; publishing a GitHub Release with
# those assets is what lets packaged apps auto-update from it.
#
# Distribution is a SEPARATE PUBLIC repo (source stays private). A public feed means the
# packaged app fetches updates with NO embedded token — pointing this at the private source
# repo would force shipping a credential in the client. Releases are pushed here only by the
# "Release - publish" workflow, using a PAT with contents:write on this repo
# (GH_RELEASES_TOKEN); the default GITHUB_TOKEN can't write a different repo.
publish:
  provider: github
  owner: piyushvijay
  repo: houston-releases

directories:
  buildResources: build
  output: release

# out/ holds the bundled main/preload/renderer. electron-builder additionally
# bundles production dependencies from package.json automatically.
#
# The provider SDKs (openai, @anthropic-ai/sdk, @google/genai) ship the runtime
# JS alongside ~17 MB of source maps, ~6 MB of .d.ts type declarations, and raw
# .ts sources — none of which the running app loads. Drop them from the asar so
# users don't download dead weight. We do NOT strip .mjs: @google/genai is an
# ESM package whose runtime entry is .mjs.
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*.{map,d.ts,d.mts,d.cts}'
  - '!node_modules/**/*.ts' # raw TypeScript sources (e.g. openai/src); never executed

# Vendor the per-(os,arch) CLI binaries (`rg`, `ast-grep`) into the app's Resources/bin
# so search/structural-search work out of the box, independent of the user's PATH. We
# use an afterPack hook rather than static `extraResources`: a single electron-builder
# config is shared across all arches of a platform and `extraResources` `from:` paths
# can't vary by arch, so a multi-arch run would copy the wrong-arch binary. The hook
# (scripts/copy-bundled-binaries.mjs) fires once per (platform, arch) and copies exactly
# the right binary, hard-failing if a sub-package is missing. `npm run dist*` first runs
# scripts/verify-bundled-binaries.mjs to assert the sources exist before packaging.
afterPack: ./scripts/copy-bundled-binaries.mjs

# node-pty is a native addon (the integrated terminal's PTY backend), so let
# electron-builder rebuild native modules against the bundled Electron ABI. The
# vendored binaries above are standalone executables, not node addons.
npmRebuild: true
asar: true
# The native .node addon can't be loaded from inside the asar archive — unpack
# node-pty so its prebuilt binary is a real file on disk at runtime.
asarUnpack:
  - node_modules/node-pty/**

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Pin the OS floor explicitly (→ LSMinimumSystemVersion in Info.plist) instead of
  # inheriting Electron's implicit minimum. Electron 42 supports "macOS Monterey and
  # up", so 12.0 is the real floor; setting it here makes an older Mac show a clean
  # "requires macOS 12.0 or later" dialog rather than a confusing dyld crash, and keeps
  # the floor from silently shifting under us on a future Electron bump.
  minimumSystemVersion: '12.0'
  # `dmg` is the human download / first install. `zip` is what electron-updater
  # actually pulls on macOS to update an installed app — without it, the published
  # latest-mac.yml has nothing the updater can fetch and auto-update never fires.
  # Both share the same generated update metadata; the zip also gets a .blockmap
  # for differential downloads.
  # Both arm64 (Apple Silicon) and x64 (Intel) are built, but each arch builds on its own
  # native runner — node-pty is a native addon and the vendored rg/ast-grep are per-arch,
  # so neither cross-compiles. Arch is therefore selected by the CLI flag in each
  # `dist:mac*` script (`--arm64` → arm64, `--x64` → x64) and deliberately NOT pinned
  # here: electron-builder merges a target's explicit `arch:` list ON TOP of the
  # CLI-requested arch (computeArchToTargetNamesMap), so listing both arm64 and x64 would
  # force every build to attempt both — and the cross-arch leg then fails in the afterPack
  # hook, since npm only installs the host-arch rg/ast-grep sub-packages. Leaving arch
  # unset lets the CLI flag alone decide which single arch the run produces.
  target:
    - dmg
    - zip
  # No Apple Developer ID on this machine — build an ad-hoc (unsigned) app.
  # To notarize later, set identity to your Developer ID Application cert, set
  # hardenedRuntime: true, add a notarize block, and flip updater.ts to auto-install.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # NOTE on auto-update: arm64 and x64 build on separate runners, and electron-builder writes
  # a single `latest-mac.yml` per build — naively publishing both clobbers one another's feed
  # (electron-builder#5592). So both arches auto-update from ONE merged feed: the arm64 leg
  # publishes its `latest-mac.yml`, then the x64 leg merges its files into it (scripts/
  # merge-mac-update-yml.mjs) and re-publishes. MacUpdater self-selects per arch from the
  # `files` list (filterFilesForArch: arm64 entries on Apple Silicon, the rest on Intel).
  # See `.github/workflows/release-publish.yml`.

win:
  icon: build/icon.ico
  # nsis = human installer; zip = the differential-download artifact the updater pulls
  # (Windows nsis updates read latest.yml). windows-latest is x64; arm64 Windows is a
  # follow-up (needs a windows-11-arm runner).
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # Unsigned for now → SmartScreen warns on first run until an Authenticode (OV/EV) cert
  # signs the installer. Seam: set CSC_LINK + CSC_KEY_PASSWORD (or signtoolOptions) when one exists.

linux:
  icon: build/icon.png
  category: Development
  # The .deb (Debian) target requires a package maintainer. electron-builder derives it
  # from package.json `author` (now name + email), but set it explicitly too so the deb
  # build never fails on a missing maintainer. Uses the project's dev contact address.
  maintainer: Houston developers <dev@houstoncode.ai>
  # AppImage = portable + the ONLY Linux target electron-updater can auto-update (reads
  # latest-linux.yml). deb = native Debian/Ubuntu install but does NOT auto-update. The
  # bundled ast-grep has no musl variant, so builds require a glibc runner (ubuntu is fine).
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nsis:
  oneClick: false # show the install dir / progress — less alarming than a silent install
  perMachine: false # per-user install → no UAC elevation prompt
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Runtime deps for an Electron app on Debian/Ubuntu; pin so a minimal container has them.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
