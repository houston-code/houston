appId: com.houston.app
productName: Houston
copyright: Copyright © 2026 Houston contributors

# Update feed for electron-updater. electron-builder generates the update
# metadata (latest-mac.yml) alongside the DMG; publishing a GitHub Release with
# those assets is what lets packaged apps auto-update from it.
publish:
  provider: github
  owner: piyushvijay
  repo: houston

directories:
  buildResources: build
  output: release

# out/ holds the bundled main/preload/renderer. electron-builder additionally
# bundles production dependencies from package.json automatically.
#
# The provider SDKs (openai, @anthropic-ai/sdk, @google/genai) ship the runtime
# JS alongside ~17 MB of source maps, ~6 MB of .d.ts type declarations, and raw
# .ts sources — none of which the running app loads. Drop them from the asar so
# users don't download dead weight. We do NOT strip .mjs: @google/genai is an
# ESM package whose runtime entry is .mjs.
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*.{map,d.ts,d.mts,d.cts}'
  - '!node_modules/**/*.ts' # raw TypeScript sources (e.g. openai/src); never executed

# Vendor CLI binaries into the app's Resources so search works fast out of the
# box, independent of the user's PATH. `@vscode/ripgrep` and `@ast-grep/cli` are
# build-time-only (dev) dependencies whose platform sub-packages ship the
# prebuilt binaries; we copy just the arm64 binaries (the only build target) to
# Resources/bin, where the main process resolves them via `process.resourcesPath`
# (see src/main/binaries.ts).
#
# WARNING: electron-builder treats a missing `from:` source as a non-fatal
# WARNING and copies nothing, so a build can succeed yet ship an app missing a
# binary (e.g. when npm skips an optional platform sub-package). `npm run dist`
# runs scripts/verify-bundled-binaries.mjs first to turn that into a hard failure;
# keep every entry below covered by that check.
extraResources:
  - from: node_modules/@vscode/ripgrep-darwin-arm64/bin/rg
    to: bin/rg
  - from: node_modules/@ast-grep/cli-darwin-arm64/ast-grep
    to: bin/ast-grep

# No native modules — skip the rebuild step. (The vendored binaries above are
# standalone executables, not node addons, so there's nothing to rebuild.)
npmRebuild: false
asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # `dmg` is the human download / first install. `zip` is what electron-updater
  # actually pulls on macOS to update an installed app — without it, the published
  # latest-mac.yml has nothing the updater can fetch and auto-update never fires.
  # Both share the same generated update metadata; the zip also gets a .blockmap
  # for differential downloads.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # No Apple Developer ID on this machine — build an ad-hoc (unsigned) app.
  # To notarize later, set identity to your Developer ID and configure notarize.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
